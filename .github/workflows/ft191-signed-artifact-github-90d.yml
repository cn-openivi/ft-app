name: FT191 remove oversized GitHub Actions artifact - no Release

on:
  push:
    branches:
      - openivi/ft191-stabilization-hotfix-20261118
    paths:
      - '.github/workflows/ft191-signed-artifact-github-90d.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: ft191-actions-quota-cleanup-20261119
  cancel-in-progress: false

jobs:
  delete-long-retention-artifact:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - name: Remove only verified 90-day signed test artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'cn-openivi/ft-app'
          test "$GITHUB_REF_NAME" = 'openivi/ft191-stabilization-hotfix-20261118'
          test -n "$GH_TOKEN"
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url='https://api.github.com/repos/cn-openivi/ft-app/actions/artifacts/14534418005'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          def call(method):
              req=urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=40) as rsp:
                      return rsp.status, rsp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
          status,body=call('GET')
          if status==200:
              a=json.loads(body)
              assert a['id']==14534418005
              assert a['name']=='FT191_XA60_OWNER_SIGNED_TEST_APK_90_DAYS'
              assert a['size_in_bytes']==41301132
              print('FT191_RETENTION_90D_IDENTITY=PASS')
              delete_status,_=call('DELETE')
              assert delete_status==204, 'DELETE status '+str(delete_status)
          else:
              assert status==404, 'Unexpected GET status '+str(status)
              print('FT191_RETENTION_90D_ALREADY_ABSENT')
          final,_=call('GET')
          assert final==404, 'Artifact still exists, status '+str(final)
          print('FT191_90_DAY_ARTIFACT_DELETE_READBACK=PASS')
          print('FT191_NEW_ARTIFACT_UPLOAD=NO')
          print('FT191_RELEASE_PUBLICATION=NO')
          PY
