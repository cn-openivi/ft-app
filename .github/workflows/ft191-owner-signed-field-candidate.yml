name: FT191 owner-signed field-test candidate (no release)

on:
  push:
    branches:
      - openivi/ft191-stabilization-hotfix-20261118
    paths:
      - '.github/workflows/ft191-owner-signed-field-candidate.yml'

permissions:
  contents: read

concurrency:
  group: ft191-owner-signed-field-candidate-20261119
  cancel-in-progress: false

jobs:
  owner-signed-field-candidate:
    runs-on: [self-hosted, linux]
    timeout-minutes: 120
    steps:
      - name: Checkout gated FT191 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable FT191 source and owner field-test authorization scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$GITHUB_REPOSITORY" = 'cn-openivi/ft-app'
          test "$GITHUB_REF_NAME" = 'openivi/ft191-stabilization-hotfix-20261118'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_sha=685f7988d812c6396d6592203146e3d2ad3e5f66
          previous_sha=c0ddf75823c1b8a1383358bc474dc4b201373cf4
          git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
          git merge-base --is-ancestor "$previous_sha" "$GITHUB_SHA"
          git diff --quiet "$source_sha" "$GITHUB_SHA" -- app server
          changed="$(git diff --name-only "$previous_sha" "$GITHUB_SHA")"
          test "$changed" = '.github/workflows/ft191-owner-signed-field-candidate.yml'
          grep -Fq 'applicationId = "app.ft.xa60"' app/build.gradle.kts
          grep -Fq 'versionCode = 191' app/build.gradle.kts
          grep -Fq 'versionName = "3.9.77-xa60-ft191-stabilization-hotfix-candidate"' app/build.gradle.kts
          test ! -e ft-xa60-signing.properties
          test ! -e .ft-xa60/ft-xa60-owner.p12
          echo "FT191_SIGNED_FIELD_SOURCE_SHA=$source_sha"
          echo "FT191_SIGNED_FIELD_WORKFLOW_SHA=$GITHUB_SHA"
          echo "FT191_SIGNING_SCOPE=OWNER_AUTHORIZED_FIELD_TEST_ONLY"
          echo "RELEASE=NOT_AUTHORIZED"
          df -h /

      - name: JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Restore existing owner keystore from existing GitHub Secret and pin cert
        shell: bash
        env:
          FT_XA60_SIGNING_BUNDLE_JSON: ${{ secrets.FT_XA60_SIGNING_BUNDLE_JSON }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, sys
          raw = os.environ.get("FT_XA60_SIGNING_BUNDLE_JSON", "")
          if not raw:
              sys.exit("Existing FT_XA60_SIGNING_BUNDLE_JSON secret unavailable: stop")
          bundle = json.loads(raw)
          assert bundle["format"] == "openivi-ft-xa60-pkcs12-v1"
          assert bundle["alias"] == "openivi_ft_xa60"
          keystore_bytes = base64.b64decode(bundle["keystore_b64"], validate=True)
          assert hashlib.sha256(keystore_bytes).hexdigest() == bundle["keystore_sha256"]
          password = bundle["store_password"]
          assert password and all(c in "0123456789abcdef" for c in password)
          d = pathlib.Path(".ft-xa60")
          d.mkdir(mode=0o700, exist_ok=True)
          keystore = d / "ft-xa60-owner.p12"
          keystore.write_bytes(keystore_bytes)
          keystore.chmod(0o600)
          password_path = d / "password.txt"
          password_path.write_text(password)
          password_path.chmod(0o600)
          props = pathlib.Path("ft-xa60-signing.properties")
          props.write_text("storeFile=.ft-xa60/ft-xa60-owner.p12\nstorePassword="+password+
                           "\nkeyAlias=openivi_ft_xa60\nkeyPassword="+password+"\n")
          props.chmod(0o600)
          PY
          actual="$(keytool -exportcert -alias openivi_ft_xa60 -keystore .ft-xa60/ft-xa60-owner.p12 -storepass:file .ft-xa60/password.txt | sha256sum | awk '{print $1}')"
          expected=e877ebac8f7938789b6fbac36248a866aeb4803370fe46ad9bd8f397a07f691c
          test "$actual" = "$expected"
          echo "FT_XA60_PINNED_SIGNER_SHA256=$actual" >> "$GITHUB_ENV"
          echo "FT191_OWNER_CERT_MATCHES_PREVIOUS_SIGNED_FT190=PASS"

      - name: Release-variant JUnit, lintVitalRelease and signed APK build
        shell: bash
        env:
          GRADLE_USER_HOME: /srv/openivi-ci/.gradle-ci
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 --console=plain \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs='-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dkotlin.incremental=false \
            :app:testReleaseUnitTest :app:lintVitalRelease :app:assembleRelease --stacktrace

      - name: Verify signed field APK, package, upgrade version and old owner certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=sorted(Path("app/build/test-results/testReleaseUnitTest").glob("TEST-*.xml"))
          assert files, "No FT191 release JUnit result"
          suites=[ET.parse(p).getroot() for p in files]
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ("tests","failures","errors","skipped")}
          print("FT191_SIGNED_FIELD_RELEASE_JUNIT="+str(totals))
          assert totals["tests"] >= 1139, totals
          assert totals["failures"] == totals["errors"] == totals["skipped"] == 0
          PY
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          test "$(stat -c%s "$apk")" -gt 1000000
          unzip -t "$apk" >/dev/null
          unzip -Z1 "$apk" | grep -Fxq 'classes.dex'
          unzip -Z1 "$apk" | grep -Fxq 'AndroidManifest.xml'
          test -n "$ANDROID_HOME"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$apk" > apk-badging.txt
          grep -Fq "package: name='app.ft.xa60' versionCode='191'" apk-badging.txt
          if grep -q '^application-debuggable' apk-badging.txt; then
            echo 'FT191 field build must not be debuggable' >&2
            exit 1
          fi
          "$BT/apksigner" verify --verbose --print-certs "$apk" > apksigner.txt
          grep -iq "$FT_XA60_PINNED_SIGNER_SHA256" apksigner.txt
          mkdir -p verified
          cp "$apk" verified/FT191_XA60_OWNER_SIGNED_FIELD_CANDIDATE.apk
          cp apk-badging.txt apksigner.txt verified/
          (cd verified && sha256sum FT191_XA60_OWNER_SIGNED_FIELD_CANDIDATE.apk > SHA256SUMS)
          printf 'SOURCE_SHA=685f7988d812c6396d6592203146e3d2ad3e5f66\nCI_SHA=%s\nAPP_ID=app.ft.xa60\nVERSION_CODE=191\nSIGNED=OWNER_CERT\nCERT_SHA256=%s\nPURPOSE=FIELD_TEST_ONLY\nFIELD=NOT_TESTED\nRELEASE=NOT_AUTHORIZED\n' "$GITHUB_SHA" "$FT_XA60_PINNED_SIGNER_SHA256" > verified/PROVENANCE.txt
          echo "FT191_SIGNED_FIELD_APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
          echo "FT191_SIGNED_FIELD_TEST_CANDIDATE=PASS"
          echo "FT191_PUBLIC_RELEASE=FORBIDDEN"

      - name: Upload short-lived owner-signed field candidate (never publish a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ft191-owner-signed-FIELD-ONLY-${{ github.sha }}
          path: verified/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove only ephemeral owner signing material and workspace build outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- ft-xa60-signing.properties .ft-xa60/ft-xa60-owner.p12 .ft-xa60/password.txt
          rm -f -- apk-badging.txt apksigner.txt
          for p in app/build server/build verified; do
            if test -d "$p" && test ! -L "$p"; then rm -rf -- "$p"; fi
          done
          echo "FT191_OWNER_SIGNING_MATERIAL_CLEANED=PASS"
