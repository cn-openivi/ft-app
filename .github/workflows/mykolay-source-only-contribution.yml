name: Mykolay Mirror empty audio read source-only CI

on:
  push:
    branches:
      - contrib/mykolay-mirror-audio-empty-read-20261105

permissions:
  contents: read

concurrency:
  group: mykolay-source-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contribution-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GRADLE_USER_HOME: /home/runner/.gradle-mykolay-contribution
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prove tested SHA is the PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Compile and run JVM unit regression without APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME"
          cat > "$GRADLE_USER_HOME/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2304m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental=false
          EOF
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 :app:testUnsignedTransitUnitTest --stacktrace

      - name: Verify no APK was generated
        shell: bash
        run: |
          set -euo pipefail
          if find app/build/outputs/apk -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo 'Unexpected APK: source-only CI must not produce artifacts' >&2
            exit 1
          fi
