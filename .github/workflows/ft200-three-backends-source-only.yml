name: FT200 three transport non-regression - unsigned source-only gate

on:
  push:
    branches:
      - openivi/ft200-carplay-three-backends-20261117
    paths:
      - 'app/**'
      - '.github/workflows/ft200-three-backends-source-only.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ft200-three-backends-source-only
  cancel-in-progress: true

jobs:
  source-only:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 70
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Checkout exact source without credential persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Enforce FT200 branch, source identity and unsigned-only policy
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'cn-openivi/ft-app') { throw 'Repository mismatch' }
          if ($env:GITHUB_REF_NAME -ne 'openivi/ft200-carplay-three-backends-20261117') { throw 'Branch mismatch' }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw "Wrong runner: $env:RUNNER_OS/$env:RUNNER_ARCH" }
          $gradle = Get-Content 'app/build.gradle.kts' -Raw
          if ($gradle -notmatch 'applicationId\s*=\s*"app\.ft\.xa60"') { throw 'Package mismatch' }
          if ($gradle -notmatch 'versionCode\s*=\s*200') { throw 'versionCode mismatch' }
          if ($gradle -notmatch 'versionName\s*=\s*"4\.0\.0-xa60-ft200-carplay-early-test"') { throw 'versionName mismatch' }
          $checks = @(
            @('app/src/main/java/app/ft/core/CarProtocol.kt','CARPLAY("carplay", connectionReady = false)'),
            @('app/src/main/java/app/ft/ui/components/OptionSheet.kt','enabled = option.enabled'),
            @('app/src/main/java/app/ft/ui/components/CarProtocolSetting.kt','Option("Apple CarPlay (тест)"'),
            @('app/src/main/java/app/ft/ui/components/CarProtocolSetting.kt','enabled = true'),
            @('app/src/main/java/app/ft/core/CarConnection.kt','PRESERVE_LIVE_BACKEND_EXPERIMENT_ONLY'),
            @('app/src/main/java/app/ft/core/Prefs.kt','carPlayExperimentalSelected'),
            @('app/src/main/java/app/ft/ui/components/CarProtocolState.kt','CarPlayExperimentalSelectionPolicy.display'),
            @('app/src/main/java/app/ft/ui/components/CarProtocolSetting.kt','CarPlaySdpDiagnostic()'),
            @('app/src/main/java/app/ft/iccoa/IccoaService.kt','WheelCalibrationRuntime.bindVerifiedCar(')
          )
          foreach ($check in $checks) {
            if (-not (Select-String -Path $check[0] -SimpleMatch -Pattern $check[1] -Quiet)) { throw "Source guard failed: $($check[0]) / $($check[1])" }
          }
          $required = @(
            'app/src/test/java/app/ft/core/CarPlayExperimentalSelectionPolicyTest.kt',
            'app/src/test/java/app/ft/carplay/CarPlayHfpContinuityLedgerTest.kt',
            'app/src/test/java/app/ft/carplay/CarPlayNmeaLatestOnlyBufferTest.kt',
            'app/src/test/java/app/ft/carplay/CarPlayPhoneIdentityTest.kt',
            'app/src/test/java/app/ft/core/CarProtocolFt200CompatibilityTest.kt',
            'app/src/test/java/app/ft/iccoa/IccoaDirectRecoveryPolicyTest.kt',
            'app/src/test/java/app/ft/dr/CarTunnelKalmanTest.kt',
            'app/src/main/java/app/ft/dr/WheelCalibrationRuntime.kt',
            'app/src/test/java/app/ft/core/WheelCalibrationSessionTest.kt'
          )
          foreach ($file in $required) { if (!(Test-Path $file)) { throw "Required FT200 regression source missing: $file" } }
          foreach ($file in @('app/src/main/res/values-b+ckb/strings.xml','app/src/main/res/values-b+kmr+Arab/strings.xml')) {
            if (Test-Path $file) { throw "Unexpected locale resource: $file" }
          }
          "FT200_SOURCE_SHA=$env:GITHUB_SHA" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "FT200_RUNNER=$env:RUNNER_NAME" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "FT200_RUNNER_OS=$env:RUNNER_OS/$env:RUNNER_ARCH" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'

      - name: Reuse Android SDK 36; install only missing components
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:USERPROFILE '.android\sdk'
          $latest = Join-Path $sdk 'cmdline-tools\latest'
          $sdkmanager = Join-Path $latest 'bin\sdkmanager.bat'
          if (!(Test-Path $sdkmanager)) {
            $archive = Join-Path $env:RUNNER_TEMP 'android-commandline-tools.zip'
            $extract = Join-Path $env:RUNNER_TEMP 'android-commandline-tools-extract'
            Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip' -OutFile $archive
            if (!(Test-Path $archive) -or (Get-Item $archive).Length -lt 10000000) { throw 'Android command-line tools download is incomplete' }
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            $source = Join-Path $extract 'cmdline-tools'
            if (!(Test-Path (Join-Path $source 'bin\sdkmanager.bat'))) { throw 'Android command-line tools archive layout mismatch' }
            New-Item -ItemType Directory -Force -Path (Split-Path $latest) | Out-Null
            if (Test-Path $latest) { Remove-Item $latest -Recurse -Force }
            Move-Item $source $latest
          }
          if (!(Test-Path $sdkmanager)) { throw 'Android sdkmanager unavailable' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "ANDROID_HOME=$sdk`nANDROID_SDK_ROOT=$sdk`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$(Join-Path $latest 'bin')`n$(Join-Path $sdk 'platform-tools')`n", [Text.UTF8Encoding]::new($false))
          $missing = @()
          if (!(Test-Path (Join-Path $sdk 'platform-tools\adb.exe'))) { $missing += 'platform-tools' }
          if (!(Test-Path (Join-Path $sdk 'platforms\android-36\android.jar'))) { $missing += 'platforms;android-36' }
          if (!(Test-Path (Join-Path $sdk 'build-tools\36.0.0\aapt2.exe'))) { $missing += 'build-tools;36.0.0' }
          if ($missing.Count -gt 0) {
            $licenseInfo = New-Object System.Diagnostics.ProcessStartInfo
            $licenseInfo.FileName = $env:ComSpec
            $licenseInfo.Arguments = '/d /c ""{0}" --sdk_root="{1}" --licenses"' -f $sdkmanager, $sdk
            $licenseInfo.UseShellExecute = $false
            $licenseInfo.RedirectStandardInput = $true
            $licenseInfo.CreateNoWindow = $true
            $licenseProcess = New-Object System.Diagnostics.Process
            $licenseProcess.StartInfo = $licenseInfo
            if (!$licenseProcess.Start()) { throw 'Could not start Android SDK license acceptance' }
            1..50 | ForEach-Object { $licenseProcess.StandardInput.WriteLine('y') }
            $licenseProcess.StandardInput.Close()
            $licenseProcess.WaitForExit()
            if ($licenseProcess.ExitCode -ne 0) { throw "Android SDK license acceptance failed: $($licenseProcess.ExitCode)" }
            & $sdkmanager "--sdk_root=$sdk" @missing
            if ($LASTEXITCODE -ne 0) { throw 'Android SDK package installation failed' }
          }
          foreach ($required in @('platform-tools\adb.exe','platforms\android-36\android.jar','build-tools\36.0.0\aapt2.exe')) {
            if (!(Test-Path (Join-Path $sdk $required))) { throw "Android SDK component missing: $required" }
          }
          "ANDROID_SDK_REUSED=$($missing.Count -eq 0)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "ANDROID_SDK_MISSING_COMPONENTS=$($missing -join ',')" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Compile Kotlin and run complete existing unsigned unit suite
        run: |
          $ErrorActionPreference = 'Stop'
          $gradleHome = Join-Path $env:USERPROFILE '.gradle-ft200'
          New-Item -ItemType Directory -Force -Path $gradleHome | Out-Null
          $env:GRADLE_USER_HOME = $gradleHome
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          $freeGiB = [double]$os.FreePhysicalMemory / 1MB
          $logicalCpus = [Environment]::ProcessorCount
          $workers = [int][Math]::Min(8, [Math]::Min($logicalCpus, [Math]::Max(2, [Math]::Floor(($freeGiB - 2.0) / 1.5))))
          $heapGiB = [int][Math]::Min(4, [Math]::Max(2, [Math]::Floor(($freeGiB - 2.0) * 0.4)))
          "GRADLE_USER_HOME=$gradleHome" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "GRADLE_LOGICAL_CPUS=$logicalCpus" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "GRADLE_FREE_RAM_GIB=$([Math]::Round($freeGiB,1))" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "GRADLE_MAX_WORKERS=$workers" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "GRADLE_HEAP_GIB=$heapGiB" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          .\gradlew.bat --no-daemon --build-cache "--max-workers=$workers" --console=plain '-Dorg.gradle.parallel=true' "-Dorg.gradle.jvmargs=-Xmx${heapGiB}g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" '-Dkotlin.compiler.execution.strategy=in-process' '-Dkotlin.incremental=true' :app:compileUnsignedTransitKotlin :app:testUnsignedTransitUnitTest --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Gradle failed with exit code $LASTEXITCODE" }

      - name: Require FT200 tests and full P0 regression without APK
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'app/build/test-results/testUnsignedTransitUnitTest'
          $names = @(
            'CarProtocolFt200CompatibilityTest','CarPlayExperimentalSelectionPolicyTest',
            'CarPlayHfpContinuityLedgerTest','CarPlayTrialProgressTest','CarPlayTrialPermissionPolicyTest',
            'CarPlayLocationWireInspectorTest','CarPlayTrialReportTest','CarPlaySdpObservationEpochTest',
            'CarPlayPhoneIdentityTest','CarPlayHandshakeLedgerTest','Iap2LinkFrameCodecTest',
            'Iap2ControlSessionCodecTest','Iap2ControlStreamParserTest','Iap2PhoneIdentificationProbeTest',
            'Iap2IdentificationInfoInspectorTest','Iap2CarPlayStartSchemaTest','Iap2PhoneWireObserverTest',
            'Iap2LinkNegotiatorTest','Iap2SynPayloadParserTest','Iap2ReliableLinkWindowTest','Iap2RetryDeadlineTest',
            'Iap2Ft200SafetyPolicyTest','Iap2CertificatePathFixtureTest','CarPlayMediaPreflightTest',
            'CarPlayNmeaSentencesTest','CarPlayRtspCodecTest','CarPlayAirPlayEndpointPolicyTest',
            'CarPlayWifiStartExtractorTest','CarPlayAudioFocusPolicyTest','CarPlayAudioFocusGenerationFenceTest',
            'CarPlayAvcPassthroughTest','CarPlayAirPlayNsdPolicyTest','CarPlayAirPlayNsdResolutionFenceTest',
            'CarPlayWifiDialectPolicyTest','CarPlayWifiRequestSessionTest','CarPlayWifiCallbackGateTest',
            'CarPlayFlatWifiInfoExtractorTest','CarPlayFlatWifiInfoInspectorTest','CarPlayTouchGeometryTest',
            'CarPlayNmeaSubscriptionSessionTest','CarPlayNmeaLatestOnlyBufferTest','CarProtocolTest',
            'IccoaDirectRecoveryPolicyTest','IccoaBindFailureReasonTest','CarTunnelKalmanTest',
            'WheelCalibrationSessionTest','IccoaGpsActivationRecoveryTest','CarUiViewportTest','AaSensorSubscriptionsTest'
          )
          foreach ($name in $names) {
            $match = Get-ChildItem -Path $folder -Filter ("TEST-*" + $name + ".xml") -ErrorAction SilentlyContinue
            if (!$match) { throw "Required JUnit XML missing: $name" }
          }
          $files = @(Get-ChildItem -Path $folder -Filter 'TEST-*.xml' -ErrorAction Stop)
          if ($files.Count -eq 0) { throw 'No JUnit XML results' }
          [int]$tests = 0; [int]$failures = 0; [int]$errors = 0; [int]$skipped = 0
          foreach ($file in $files) {
            [xml]$doc = Get-Content -LiteralPath $file.FullName -Raw
            $suites = @()
            if ($doc.DocumentElement.LocalName -eq 'testsuite') { $suites = @($doc.DocumentElement) }
            else { $suites = @($doc.SelectNodes("//*[local-name()='testsuite']")) }
            foreach ($suite in $suites) {
              $tests += [int]$suite.GetAttribute('tests')
              $failures += [int]$suite.GetAttribute('failures')
              $errors += [int]$suite.GetAttribute('errors')
              $skipped += [int]$suite.GetAttribute('skipped')
            }
          }
          "FT200_FULL_UNSIGNED_JUNIT tests=$tests failures=$failures errors=$errors skipped=$skipped" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($tests -lt 1052 -or $failures -ne 0 -or $errors -ne 0 -or $skipped -ne 0) { throw 'FT200 JUnit acceptance failed' }
          $apkFolder = 'app/build/outputs/apk'
          if ((Test-Path $apkFolder) -and (Get-ChildItem -Path $apkFolder -Filter '*.apk' -Recurse -ErrorAction SilentlyContinue)) { throw 'Source-only gate must not produce an APK' }
          "FT200_FULL_SOURCE_ONLY_PASS=$env:GITHUB_SHA" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          'SIGNED_APK=NOT_BUILT; HU_FIELD=NOT_TESTED' | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FT200-source-only-JUnit-reports
          path: |
            app/build/test-results/testUnsignedTransitUnitTest/
            app/build/reports/tests/testUnsignedTransitUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Clear workspace build outputs
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($p in @('app/build','server/build')) {
            if ((Test-Path $p) -and -not (Get-Item $p).Attributes.HasFlag([IO.FileAttributes]::ReparsePoint)) {
              Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
