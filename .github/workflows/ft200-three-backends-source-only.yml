name: FT200 three transport non-regression - unsigned source-only gate

on:
  push:
    branches:
      - openivi/ft200-carplay-three-backends-20261117
    paths:
      - 'app/**'
      - '.github/workflows/ft200-three-backends-source-only.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ft200-three-backends-source-only
  cancel-in-progress: true

jobs:
  source-only:
    runs-on: [self-hosted, linux]
    timeout-minutes: 70
    steps:
      - name: Checkout exact source without credential persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Enforce FT200 branch and unsigned-only policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$GITHUB_REPOSITORY" = "cn-openivi/ft-app"
          test "$GITHUB_REF_NAME" = "openivi/ft200-carplay-three-backends-20261117"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'applicationId = "app.ft.xa60"' app/build.gradle.kts
          grep -Fq 'versionCode = 190' app/build.gradle.kts
          grep -Fq 'CARPLAY("carplay", connectionReady = false)' app/src/main/java/app/ft/core/CarProtocol.kt
          grep -Fq 'enabled = option.enabled' app/src/main/java/app/ft/ui/components/OptionSheet.kt
          grep -Fq 'enabled = false' app/src/main/java/app/ft/ui/components/CarProtocolSetting.kt
          test -f app/src/test/java/app/ft/carplay/CarPlayPhoneIdentityTest.kt
          grep -Fq 'CarPlaySdpDiagnostic()' app/src/main/java/app/ft/ui/components/CarProtocolSetting.kt
          test -f app/src/test/java/app/ft/core/CarProtocolFt200CompatibilityTest.kt
          test -f app/src/test/java/app/ft/iccoa/IccoaDirectRecoveryPolicyTest.kt
          test -f app/src/test/java/app/ft/dr/CarTunnelKalmanTest.kt
          echo "FT200_SOURCE_SHA=$GITHUB_SHA"
      - name: JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Compile Kotlin and run complete existing unsigned unit suite
        shell: bash
        env:
          GRADLE_USER_HOME: /srv/openivi-ci/.gradle-ci
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 --console=plain \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs='-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dkotlin.incremental=false \
            :app:compileUnsignedTransitKotlin \
            :app:testUnsignedTransitUnitTest --stacktrace
      - name: Require FT200 tests and full P0 regression without APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          folder = Path('app/build/test-results/testUnsignedTransitUnitTest')
          names = (
              'CarProtocolFt200CompatibilityTest', 'CarPlayPhoneIdentityTest',
              'CarPlayHandshakeLedgerTest', 'Iap2LinkFrameCodecTest',
              'Iap2ControlSessionCodecTest',
              'CarProtocolTest', 'IccoaDirectRecoveryPolicyTest',
              'CarTunnelKalmanTest', 'IccoaGpsActivationRecoveryTest',
              'CarUiViewportTest', 'AaSensorSubscriptionsTest'
          )
          for name in names:
              assert list(folder.glob('TEST-*' + name + '.xml')), name + ': missing JUnit XML'
          all_paths = list(folder.glob('TEST-*.xml'))
          assert all_paths, 'No JUnit XML results'
          suites = [ET.parse(p).getroot() for p in all_paths]
          totals = {k: sum(int(s.get(k,0)) for s in suites) for k in
                    ('tests','failures','errors','skipped')}
          print('FT200_FULL_UNSIGNED_JUNIT=' + str(totals))
          assert totals['tests'] >= 1052
          assert totals['failures'] == 0
          assert totals['errors'] == 0
          assert totals['skipped'] == 0
          PY
          if find app/build/outputs/apk -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo 'FT200 source-only gate MUST NOT produce an APK' >&2
            exit 1
          fi
          echo "FT200_FULL_SOURCE_ONLY_PASS=$GITHUB_SHA"
          echo "SIGNED_APK=NOT_BUILT; HU_FIELD=NOT_TESTED"
      - name: Clear workspace build outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for p in app/build server/build; do
            if test -d "$p" && test ! -L "$p"; then rm -rf -- "$p"; fi
          done
