name: FT186 field candidate exact-source compile and JVM tests

# Owner specifically authorized FT186 build and field candidate on 2026-11-14.
# No signing/APK in this step; owner-signed release gates separately on PASS.
on:
  push:
    branches: [openivi/ft186-field-p0-video-pairing-20261114]
    paths:
      - '.github/workflows/ft186-field-source-ci.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ft186-owner-field-source-ci
  cancel-in-progress: true

jobs:
  source-only-verify:
    runs-on: [self-hosted, linux]
    timeout-minutes: 70
    steps:
      - name: Checkout exact owner-approved FT186 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Guard branch, version, changed source and FT186 field fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$GITHUB_REPOSITORY" = "cn-openivi/ft-app"
          test "$GITHUB_REF_NAME" = "openivi/ft186-field-p0-video-pairing-20261114"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'applicationId = "app.ft.xa60"' app/build.gradle.kts
          grep -Fq 'versionCode = 186' app/build.gradle.kts
          test -f app/src/main/java/app/ft/iccoa/IccoaFirstIdrHandoff.kt
          test -f app/src/main/java/app/ft/iccoa/IccoaDirectTouchMap.kt
          test -f app/src/test/java/app/ft/iccoa/IccoaFirstIdrHandoffTest.kt
          test -f app/src/test/java/app/ft/iccoa/IccoaTrustedCarKeyOwnerResetTest.kt
          test -f app/src/main/java/app/ft/core/BluetoothCalls.kt
          test -f app/src/test/java/app/ft/iccoa/IccoaCarBluetoothRolesTest.kt
          echo "FT186_SOURCE_SHA=$GITHUB_SHA"
      - name: JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK build-tools 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Compile FT186 Kotlin and run all unsignedTransit JVM tests
        shell: bash
        env:
          GRADLE_USER_HOME: /srv/openivi-ci/.gradle-ci
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 --console=plain \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs='-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dkotlin.incremental=false \
            :app:compileUnsignedTransitKotlin :app:testUnsignedTransitUnitTest --stacktrace
      - name: Verify exact JUnit results without creating APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files=list(Path('app/build/test-results/testUnsignedTransitUnitTest').glob('TEST-*.xml'))
          assert files, 'No JUnit XML results'
          totals={k:sum(int(ET.parse(f).getroot().get(k,0)) for f in files)
                  for k in ('tests','failures','errors','skipped')}
          print('FT186_SOURCE_JUNIT_TOTALS='+str(totals),flush=True)
          assert totals['tests']>=900 and totals['failures']==totals['errors']==0
          for needle in ('IccoaFirstIdrHandoffTest','IccoaTrustedCarKeyOwnerResetTest',
                         'IccoaWelcomeTargetTest','IccoaStreamQueueTest',
                         'IccoaDirectTouchMapTest','IccoaCarBluetoothRolesTest'):
              matches=[f for f in files if needle in f.name]
              assert matches, 'Missing focused test '+needle
              assert sum(int(ET.parse(f).getroot().get('tests',0)) for f in matches)>0
          PY
          if find app/build/outputs/apk -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "Refusing unexpected APK in compile-only gate" >&2
            exit 1
          fi
          echo "FT186_SOURCE_CI_PASS=$GITHUB_SHA"
          echo "FIELD=NOT_TESTED"
      - name: Remove temporary build output, preserve shared Gradle cache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for p in app/build server/build; do
            if test -d "$p" && test ! -L "$p"; then rm -rf -- "$p"; fi
          done
