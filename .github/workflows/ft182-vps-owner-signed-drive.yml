name: FT182 XA60 owner-signed field-test VPS-to-Drive-and-GitHub build

on:
  push:
    branches:
      - openivi/ft182-supercast-ux-source-20261113
    paths:
      - '.github/workflows/ft182-vps-owner-signed-drive.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ft182-vps-owner-signed-drive
  cancel-in-progress: false

jobs:
  verify-owner-signed:
    runs-on: [self-hosted, linux]
    timeout-minutes: 75
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify FT182 source-only candidate and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$GITHUB_REPOSITORY" = 'cn-openivi/ft-app'
          test "$GITHUB_REF_NAME" = 'openivi/ft182-supercast-ux-source-20261113'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor b7727791af7b07bb3ef50baa05fcb7c53ee01a56 "$GITHUB_SHA"
          # Allow exactly the reviewed packaging fix and this delivery workflow.
          mapfile -t delta < <(git diff --name-only b7727791af7b07bb3ef50baa05fcb7c53ee01a56 "$GITHUB_SHA")
          test "${#delta[@]}" -eq 2
          test "${delta[0]}" = '.github/workflows/ft182-vps-owner-signed-drive.yml'
          test "${delta[1]}" = 'app/build.gradle.kts'
          grep -Fq 'resources.pickFirsts += setOf("META-INF/LICENSE.md", "META-INF/NOTICE.md")' app/build.gradle.kts
          grep -Fq 'applicationId = "app.ft.xa60"' app/build.gradle.kts
          grep -Fq 'versionCode = 182' app/build.gradle.kts
          grep -Fq 'versionName = "3.9.68-xa60-ft182-source-preview"' app/build.gradle.kts
          echo "SOURCE_SHA=b7727791af7b07bb3ef50baa05fcb7c53ee01a56"
          echo "WORKFLOW_SHA=$GITHUB_SHA"
      - name: JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Restore existing FT owner signing bundle from GitHub Secrets
        shell: bash
        env:
          FT_XA60_SIGNING_BUNDLE_JSON: ${{ secrets.FT_XA60_SIGNING_BUNDLE_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, sys
          raw = os.environ.get("FT_XA60_SIGNING_BUNDLE_JSON", "")
          if not raw:
              sys.exit("Required existing FT_XA60_SIGNING_BUNDLE_JSON is not available to this run")
          bundle = json.loads(raw)
          assert bundle["format"] == "openivi-ft-xa60-pkcs12-v1"
          assert bundle["alias"] == "openivi_ft_xa60"
          key = base64.b64decode(bundle["keystore_b64"], validate=True)
          assert hashlib.sha256(key).hexdigest() == bundle["keystore_sha256"]
          password = bundle["store_password"]
          assert password and all(c in "0123456789abcdef" for c in password)
          private = pathlib.Path(".ft-xa60")
          private.mkdir(mode=0o700, exist_ok=True)
          keystore = private / "ft-xa60-owner.p12"
          keystore.write_bytes(key)
          keystore.chmod(0o600)
          pw_file = private / "password.txt"
          pw_file.write_text(password)
          pw_file.chmod(0o600)
          props = pathlib.Path("ft-xa60-signing.properties")
          props.write_text("storeFile=.ft-xa60/ft-xa60-owner.p12\nstorePassword="+password+
                          "\nkeyAlias=openivi_ft_xa60\nkeyPassword="+password+"\n")
          props.chmod(0o600)
          PY
          actual="$(keytool -exportcert -alias openivi_ft_xa60 -keystore .ft-xa60/ft-xa60-owner.p12 -storepass:file .ft-xa60/password.txt | sha256sum | awk '{print $1}')"
          expected=e877ebac8f7938789b6fbac36248a866aeb4803370fe46ad9bd8f397a07f691c
          test "$actual" = "$expected"
          echo "FT_XA60_PINNED_SIGNER_SHA256=$actual" >> "$GITHUB_ENV"
          echo "Existing FT owner cert matched the historical FT173/174 certificate."
      - name: Run FT182 release tests, release lint and assemble signed APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs='-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
            -Dkotlin.compiler.execution.strategy=in-process \
            :app:testReleaseUnitTest :app:lintVitalRelease :app:assembleRelease
      - name: Verify FT182 upgrade identity, permanent owner certificate and APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          test "$(stat -c%s "$apk")" -gt 1000000
          unzip -t "$apk" >/dev/null
          unzip -Z1 "$apk" | grep -Fxq 'classes.dex'
          unzip -Z1 "$apk" | grep -Fxq 'AndroidManifest.xml'
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT="$SDK/build-tools/36.0.0"
          "$BT/aapt" dump badging "$apk" | tee apk-badging.txt
          grep -Fq "package: name='app.ft.xa60' versionCode='182'" apk-badging.txt
          if grep -q '^application-debuggable' apk-badging.txt; then
            echo 'Refusing debuggable APK' >&2
            exit 1
          fi
          "$BT/apksigner" verify --verbose --print-certs "$apk" | tee apksigner.txt
          grep -iq "$FT_XA60_PINNED_SIGNER_SHA256" apksigner.txt
          mkdir -p verified
          cp "$apk" verified/FT182_XA60_OWNER_SIGNED.apk
          cp apk-badging.txt apksigner.txt verified/
          (cd verified && sha256sum FT182_XA60_OWNER_SIGNED.apk > SHA256SUMS)
          printf 'SOURCE_SHA=b7727791af7b07bb3ef50baa05fcb7c53ee01a56\nCI_SHA=%s\nVERSION_CODE=182\nAPP_ID=app.ft.xa60\nSIGNATURE=OWNER_SIGNED\nCERT_SHA256=%s\nFIELD=NOT_TESTED\n' "$GITHUB_SHA" "$FT_XA60_PINNED_SIGNER_SHA256" > verified/PROVENANCE.txt
      - name: Deliver signed FT182 APK to existing Google Drive rclone remote and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          command -v rclone
          rclone listremotes | grep -Fxq 'openivi-drive:'
          local="verified/FT182_XA60_OWNER_SIGNED.apk"
          target="openivi-drive:FT182_XA60_OWNER_SIGNED_${GITHUB_SHA:0:8}.apk"
          # Remote openivi-drive: is already rooted at verified CI_BUILDS folder.
          opts=(--tpslimit 0.5 --tpslimit-burst 1 --drive-pacer-min-sleep 2s --drive-pacer-burst 1 --retries 12 --retries-sleep 30s --low-level-retries 20)
          rclone copyto "$local" "$target" "${opts[@]}"
          expected="$(sha256sum "$local" | cut -d' ' -f1)"
          received="$(rclone cat "$target" "${opts[@]}" | sha256sum | cut -d' ' -f1)"
          test "$expected" = "$received"
          test "$(rclone size "$target" --json "${opts[@]}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["bytes"])')" = "$(stat -c%s "$local")"
          for name in SHA256SUMS PROVENANCE.txt apk-badging.txt apksigner.txt; do
            rclone copyto "verified/$name" "openivi-drive:FT182_${GITHUB_SHA:0:8}_$name" "${opts[@]}"
            test "$(sha256sum "verified/$name" | cut -d' ' -f1)" = "$(rclone cat "openivi-drive:FT182_${GITHUB_SHA:0:8}_$name" "${opts[@]}" | sha256sum | cut -d' ' -f1)"
          done
          echo "FT182_DRIVE_SIGNED_APK_PATH=$target"
          echo "FT182_SIGNED_APK_SHA256=$expected"
          echo 'FT182_DRIVE_READBACK_SHA256=PASS'
      - name: Publish signed FT182 GitHub prerelease and independently verify downloaded APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s verified/FT182_XA60_OWNER_SIGNED.apk
          test -n "$GH_TOKEN"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys, urllib.error, urllib.parse, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          apk = pathlib.Path("verified/FT182_XA60_OWNER_SIGNED.apk")
          raw = apk.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          tag = "xa60-ft182-" + sha[:8]
          api = "https://api.github.com/repos/" + repo
          headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "OpenIVI-FT182-CI"}
          def request(method, url, data=None, ctype="application/json"):
              body = None if data is None else (data if isinstance(data, bytes) else json.dumps(data).encode())
              h = dict(headers)
              if body is not None:
                  h["Content-Type"] = ctype
              req = urllib.request.Request(url, data=body, headers=h, method=method)
              with urllib.request.urlopen(req, timeout=180) as resp:
                  return json.load(resp)
          try:
              release = request("GET", api + "/releases/tags/" + tag)
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
              release = request("POST", api + "/releases", {
                  "tag_name": tag, "target_commitish": sha,
                  "name": "FT182 XA60 owner-signed field test (" + sha[:8] + ")",
                  "body": ("Owner-signed field-test APK, app.ft.xa60 versionCode 182. "
                           "CI source " + sha + ". APK SHA-256 " + digest + ". "
                           "Owner cert SHA-256 " + os.environ["FT_XA60_PINNED_SIGNER_SHA256"] +
                           ". Android Auto car GPS and physical HU field behavior NOT VERIFIED. "
                           "CI run " + os.environ["GITHUB_RUN_ID"] + "."),
                  "draft": True, "prerelease": True
              })
          assert release["tag_name"] == tag, "GitHub release identity mismatch"
          asset_name = apk.name
          assets = release.get("assets", [])
          existing = next((a for a in assets if a["name"] == asset_name), None)
          if existing is None:
              url = release["upload_url"].split("{", 1)[0] + "?name=" + urllib.parse.quote(asset_name)
              existing = request("POST", url, raw, "application/vnd.android.package-archive")
          assert existing["size"] == len(raw), "GitHub asset size differs"
          assert existing.get("digest") == "sha256:" + digest, "GitHub asset SHA-256 differs"
          # Publish the verified binary only as a prerelease, not a stable release.
          if release["draft"]:
              release = request("PATCH", api + "/releases/" + str(release["id"]), {"draft": False, "prerelease": True})
          release = request("GET", api + "/releases/tags/" + tag)
          assert not release["draft"] and release["prerelease"], "Release publication mismatch"
          asset = next(a for a in release["assets"] if a["name"] == asset_name)
          assert asset["size"] == len(raw) and asset.get("digest") == "sha256:" + digest
          download = urllib.request.Request(asset["browser_download_url"],
                                            headers={"User-Agent": "OpenIVI-FT182-readback"})
          hasher = hashlib.sha256()
          downloaded_bytes = 0
          with urllib.request.urlopen(download, timeout=180) as resp:
              while True:
                  chunk = resp.read(1024 * 1024)
                  if not chunk:
                      break
                  hasher.update(chunk)
                  downloaded_bytes += len(chunk)
          assert downloaded_bytes == len(raw) and hasher.hexdigest() == digest, "GitHub downloaded APK differs"
          print("FT182_GITHUB_PRERELEASE=" + release["html_url"])
          print("FT182_GITHUB_ASSET=" + asset["browser_download_url"])
          print("FT182_GITHUB_ASSET_SHA256=" + digest)
          print("FT182_GITHUB_FULL_DOWNLOAD_SHA256=PASS")
          PY
      - name: Remove only local FT182 build outputs after full Drive hash readback
        shell: bash
        run: |
          set -euo pipefail
          for p in app/build server/build verified; do
            test ! -L "$p"
            if test -d "$p"; then rm -rf -- "$p"; fi
          done
          rm -f apk-badging.txt apksigner.txt
          echo "FT182_VPS_BUILD_CLEANUP_AFTER_DRIVE_READBACK=PASS"
      - name: Remove only ephemeral restored signing material
        if: always()
        shell: bash
        run: |
          rm -f ft-xa60-signing.properties .ft-xa60/ft-xa60-owner.p12 .ft-xa60/password.txt
