name: FT171 Quick Auth source-only unit checks

on:
  # Source-only FT171 integration: compile and test, but NEVER assemble or publish APK.
  push:
    branches:
      - openivi/ft-post170-source-only-no-build-20261102
      - openivi/ft173-speed-widget-source-only-20261103
    paths:
      - 'app/src/main/java/app/ft/iccoa/**'
      - 'app/src/main/java/app/ft/ui/home/**'
      - 'app/src/test/java/app/ft/iccoa/**'
      - 'app/src/main/java/app/ft/ui/car/**'
      - 'app/src/test/java/app/ft/ui/car/**'
      - '.github/workflows/ft171-quick-unit-tests.yml'
  pull_request:
    branches:
      - openivi/ft-post170-source-only-no-build-20261102
      - openivi/ft173-speed-widget-source-only-20261103
    paths:
      - 'app/src/main/java/app/ft/iccoa/**'
      - 'app/src/main/java/app/ft/ui/home/**'
      - 'app/src/test/java/app/ft/iccoa/**'
      - 'app/src/main/java/app/ft/ui/car/**'
      - 'app/src/test/java/app/ft/ui/car/**'
      - '.github/workflows/ft171-quick-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ft171-quick-unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GRADLE_USER_HOME: /home/runner/.gradle-ft171-unit
    steps:
      - name: Checkout pull request without signing secrets
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: "Source-only: compile and run unit tests (NO APK tasks)"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME"
          cat > "$GRADLE_USER_HOME/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2304m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental=false
          EOF
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 :app:testUnsignedTransitUnitTest --stacktrace
      - name: Verify no release APK was produced
        shell: bash
        run: |
          set -euo pipefail
          if find app/build/outputs/apk -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo 'Unexpected APK output; unit-only job must not build or publish an APK' >&2
            exit 1
          fi
