# Owner-approved activation marker: Windows self-hosted FT200 signed build; application source remains pinned.
name: FT200 Windows home runner — owner-signed APK

on:
  push:
    branches:
      - openivi/ft200-carplay-three-backends-20261117
    paths:
      - '.github/workflows/ft200-home-windows-owner-signed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ft200-home-windows-owner-signed
  cancel-in-progress: false

jobs:
  build-sign:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      SOURCE_PIN: cd7003db636c228d7dc28f3dbb162559cb3fb15d
      CERT_PIN: e877ebac8f7938789b6fbac36248a866aeb4803370fe46ad9bd8f397a07f691c
      APK_NAME: FT200_XA60_OWNER_SIGNED_cd7003d.apk
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout exact FT200 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce exact FT200 source and Windows runner
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'cn-openivi/ft-app') { throw 'Repository mismatch' }
          if ($env:GITHUB_REF_NAME -ne 'openivi/ft200-carplay-three-backends-20261117') { throw 'Branch mismatch' }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
          git merge-base --is-ancestor $env:SOURCE_PIN $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FT200 source is not an ancestor' }
          $changed = @(git diff --name-only $env:SOURCE_PIN $env:GITHUB_SHA)
          $allowed = @('.github/workflows/ft200-vps-owner-signed-drive.yml', '.github/workflows/ft200-home-windows-owner-signed.yml')
          foreach ($path in $changed) {
            if ($path -notin $allowed) { throw "Unexpected change since FT200 source pin: $path" }
          }
          git diff --quiet $env:SOURCE_PIN $env:GITHUB_SHA -- app/src/main app/src/test server/src/main server/src/test
          if ($LASTEXITCODE -ne 0) { throw 'Application source changed after pinned FT200 source' }
          $gradle = Get-Content app/build.gradle.kts -Raw
          if ($gradle -notmatch 'applicationId\s*=\s*"app\.ft\.xa60"') { throw 'Package mismatch' }
          if ($gradle -notmatch 'versionCode\s*=\s*200') { throw 'versionCode mismatch' }
          if ($gradle -notmatch 'versionName\s*=\s*"4\.0\.0-xa60-ft200-carplay-early-test"') { throw 'versionName mismatch' }
          if ($env:RUNNER_OS -ne 'Windows') { throw "Wrong runner OS: $env:RUNNER_OS" }
          "FT200_SOURCE_SHA=$env:SOURCE_PIN" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "FT200_RUNNER=$env:RUNNER_NAME" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "FT200_RUNNER_OS=$env:RUNNER_OS" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "FT200_WORKFLOW_SHA=$env:GITHUB_SHA" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:USERPROFILE '.android\sdk'
          $latest = Join-Path $sdk 'cmdline-tools\latest'
          $sdkmanager = Join-Path $latest 'bin\sdkmanager.bat'
          if (!(Test-Path $sdkmanager)) {
            $archive = Join-Path $env:RUNNER_TEMP 'android-commandline-tools.zip'
            $extract = Join-Path $env:RUNNER_TEMP 'android-commandline-tools-extract'
            Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip' -OutFile $archive
            if (!(Test-Path $archive) -or (Get-Item $archive).Length -lt 10000000) { throw 'Android command-line tools download is incomplete' }
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            $source = Join-Path $extract 'cmdline-tools'
            if (!(Test-Path (Join-Path $source 'bin\sdkmanager.bat'))) { throw 'Android command-line tools archive layout mismatch' }
            New-Item -ItemType Directory -Force -Path (Split-Path $latest) | Out-Null
            if (Test-Path $latest) { Remove-Item $latest -Recurse -Force }
            Move-Item $source $latest
          }
          if (!(Test-Path $sdkmanager)) { throw 'Android sdkmanager is unavailable after setup' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "ANDROID_HOME=$sdk`nANDROID_SDK_ROOT=$sdk`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$(Join-Path $latest 'bin')`n$(Join-Path $sdk 'platform-tools')`n", [Text.UTF8Encoding]::new($false))
          $missing = @()
          if (!(Test-Path (Join-Path $sdk 'platform-tools\adb.exe'))) { $missing += 'platform-tools' }
          if (!(Test-Path (Join-Path $sdk 'platforms\android-36\android.jar'))) { $missing += 'platforms;android-36' }
          if (!(Test-Path (Join-Path $sdk 'build-tools\36.0.0\aapt.exe')) -or !(Test-Path (Join-Path $sdk 'build-tools\36.0.0\apksigner.bat'))) { $missing += 'build-tools;36.0.0' }
          if ($missing.Count -gt 0) {
            # Accept licenses only when a required SDK component is actually missing.
            $licenseInfo = New-Object System.Diagnostics.ProcessStartInfo
            $licenseInfo.FileName = $env:ComSpec
            $licenseInfo.Arguments = '/d /c ""{0}" --sdk_root="{1}" --licenses"' -f $sdkmanager, $sdk
            $licenseInfo.UseShellExecute = $false
            $licenseInfo.RedirectStandardInput = $true
            $licenseInfo.CreateNoWindow = $true
            $licenseProcess = New-Object System.Diagnostics.Process
            $licenseProcess.StartInfo = $licenseInfo
            if (!$licenseProcess.Start()) { throw 'Could not start Android SDK license acceptance' }
            1..50 | ForEach-Object { $licenseProcess.StandardInput.WriteLine('y') }
            $licenseProcess.StandardInput.Close()
            $licenseProcess.WaitForExit()
            if ($licenseProcess.ExitCode -ne 0) { throw "Android SDK license acceptance failed: $($licenseProcess.ExitCode)" }
            & $sdkmanager "--sdk_root=$sdk" @missing
            if ($LASTEXITCODE -ne 0) { throw 'Android SDK package installation failed' }
          }
          foreach ($required in @('platform-tools\adb.exe','platforms\android-36\android.jar','build-tools\36.0.0\aapt.exe','build-tools\36.0.0\apksigner.bat')) {
            if (!(Test-Path (Join-Path $sdk $required))) { throw "Android SDK component missing after setup: $required" }
          }
          "ANDROID_SDK_REUSED=$($missing.Count -eq 0)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "ANDROID_SDK_MISSING_COMPONENTS=$($missing -join ',')" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Restore existing FT owner signing bundle
        env:
          FT_XA60_SIGNING_BUNDLE_JSON: ${{ secrets.FT_XA60_SIGNING_BUNDLE_JSON }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:FT_XA60_SIGNING_BUNDLE_JSON)) { throw 'Existing FT owner signing secret is unavailable' }
          $bundle = $env:FT_XA60_SIGNING_BUNDLE_JSON | ConvertFrom-Json
          if ($bundle.format -ne 'openivi-ft-xa60-pkcs12-v1') { throw 'Signing bundle format mismatch' }
          if ($bundle.alias -ne 'openivi_ft_xa60') { throw 'Signing alias mismatch' }
          $bytes = [Convert]::FromBase64String([string]$bundle.keystore_b64)
          $sha = ([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          if ($sha -ne [string]$bundle.keystore_sha256) { throw 'Signing keystore digest mismatch' }
          if ([string]$bundle.store_password -notmatch '^[0-9a-f]+$') { throw 'Signing password format mismatch' }
          $private = Join-Path $env:RUNNER_TEMP 'ft200-signing'
          New-Item -ItemType Directory -Force -Path $private | Out-Null
          $keyPath = Join-Path $private 'ft-xa60-owner.p12'
          $pwPath = Join-Path $private 'password.txt'
          [IO.File]::WriteAllBytes($keyPath, $bytes)
          [IO.File]::WriteAllText($pwPath, [string]$bundle.store_password)
          $propsPath = Join-Path $env:GITHUB_WORKSPACE 'ft-xa60-signing.properties'
          $keyGradlePath = $keyPath.Replace('\','/')
          $props = @("storeFile=$keyGradlePath", "storePassword=$($bundle.store_password)", "keyAlias=openivi_ft_xa60", "keyPassword=$($bundle.store_password)") -join [Environment]::NewLine
          [IO.File]::WriteAllText($propsPath, $props + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          $certPath = Join-Path $private 'owner-cert.der'
          & keytool -exportcert -alias openivi_ft_xa60 -keystore $keyPath "-storepass:file" $pwPath -file $certPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect owner signing certificate' }
          $cert = (Get-FileHash $certPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($cert -ne $env:CERT_PIN) { throw 'Owner certificate SHA-256 mismatch' }
          "FT_XA60_PINNED_SIGNER_SHA256=$cert" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Run release tests, lint and assemble owner-signed APK
        run: |
          $ErrorActionPreference = 'Stop'
          $gradleHome = Join-Path $env:USERPROFILE '.gradle-ft200'
          New-Item -ItemType Directory -Force -Path $gradleHome | Out-Null
          $env:GRADLE_USER_HOME = $gradleHome
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          $freeGiB = [double]$os.FreePhysicalMemory / 1MB
          $logicalCpus = [Environment]::ProcessorCount
          $workers = [int][Math]::Min(8, [Math]::Min($logicalCpus, [Math]::Max(2, [Math]::Floor(($freeGiB - 2.0) / 1.5))))
          $heapGiB = [int][Math]::Min(4, [Math]::Max(2, [Math]::Floor(($freeGiB - 2.0) * 0.4)))
          "GRADLE_USER_HOME=$gradleHome" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "GRADLE_LOGICAL_CPUS=$logicalCpus" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "GRADLE_FREE_RAM_GIB=$([Math]::Round($freeGiB,1))" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "GRADLE_MAX_WORKERS=$workers" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "GRADLE_HEAP_GIB=$heapGiB" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          .\gradlew.bat --no-daemon --build-cache "--max-workers=$workers" --console=plain '-Dorg.gradle.parallel=true' "-Dorg.gradle.jvmargs=-Xmx${heapGiB}g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" '-Dkotlin.compiler.execution.strategy=in-process' '-Dkotlin.incremental=true' :app:testReleaseUnitTest :app:lintVitalRelease :app:assembleRelease --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Gradle failed with exit code $LASTEXITCODE" }

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FT200-JUnit-reports
          path: |
            app/build/test-results/testReleaseUnitTest/
            app/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK identity, signature and provenance
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = Join-Path $env:GITHUB_WORKSPACE 'app\build\outputs\apk\release\app-release.apk'
          if (!(Test-Path $apk) -or (Get-Item $apk).Length -lt 1000000) { throw 'Release APK missing or unexpectedly small' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($apk)
          try {
            $entries = @($zip.Entries | ForEach-Object FullName)
            if ('classes.dex' -notin $entries -or 'AndroidManifest.xml' -notin $entries) { throw 'APK structure invalid' }
          } finally { $zip.Dispose() }
          $bt = Join-Path $env:ANDROID_HOME 'build-tools\36.0.0'
          $badging = & (Join-Path $bt 'aapt.exe') dump badging $apk 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'aapt failed' }
          $badgingText = $badging -join [Environment]::NewLine
          $badgingText | Set-Content apk-badging.txt
          if ($badgingText -notmatch "package: name='app\.ft\.xa60' versionCode='200'") { throw 'APK package/versionCode mismatch' }
          if ($badgingText -notmatch "versionName='4\.0\.0-xa60-ft200-carplay-early-test'") { throw 'APK versionName mismatch' }
          if ($badgingText -match '(?m)^application-debuggable') { throw 'Refusing debuggable APK' }
          $signer = & (Join-Path $bt 'apksigner.bat') verify --verbose --print-certs $apk 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'apksigner verification failed' }
          $signerText = $signer -join [Environment]::NewLine
          $signerText | Set-Content apksigner.txt
          if ($signerText -notmatch [regex]::Escape($env:CERT_PIN)) { throw 'APK signer certificate mismatch' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'verified'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dest = Join-Path $out $env:APK_NAME
          Copy-Item $apk $dest -Force
          $apkSha = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          $prov = @("SOURCE_SHA=$env:SOURCE_PIN","WORKFLOW_SHA=$env:GITHUB_SHA","PACKAGE=app.ft.xa60","VERSION_CODE=200","VERSION_NAME=4.0.0-xa60-ft200-carplay-early-test","SIGNATURE=OWNER_SIGNED","CERT_SHA256=$env:CERT_PIN","APK_SHA256=$apkSha","FIELD=NOT_TESTED","RELEASE=NOT_PUBLISHED") -join [Environment]::NewLine
          Set-Content (Join-Path $out 'PROVENANCE.txt') $prov
          "APK_SHA256=$apkSha" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "APK=$env:APK_NAME" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          Copy-Item apk-badging.txt,apksigner.txt $out -Force
          "FT200_SIGNED_APK_SHA256=$apkSha"

      - name: Upload verified signed APK and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FT200-XA60-owner-signed
          path: verified/
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral signing material
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item (Join-Path $env:GITHUB_WORKSPACE 'ft-xa60-signing.properties') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP 'ft200-signing') -Recurse -Force -ErrorAction SilentlyContinue
