name: FT181 owner-signed APK - recover on VPS to GitHub Release and Drive
on:
  push:
    branches: [openivi/ft181-default-picture-dpi-240-20261112]
    paths: ['.github/workflows/ft181-vps-release-drive-recovery.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ft181-vps-owner-signed-drive
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_PIN: a99ed721053c2b976d14cadbd98388fc6bbb4a0f
      APK_NAME: FT181_XA60_OWNER_SIGNED_a99ed721.apk
      CERT_PIN: e877ebac8f7938789b6fbac36248a866aeb4803370fe46ad9bd8f397a07f691c
    steps:
      - name: Preserve existing signed binary
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - name: Verify exact approved source and runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$GITHUB_REPOSITORY" = cn-openivi/ft-app
          test "$GITHUB_REF_NAME" = openivi/ft181-default-picture-dpi-240-20261112
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_PIN" "$GITHUB_SHA"
          git diff --quiet "$SOURCE_PIN" "$GITHUB_SHA" -- app/src/main app/src/test app/build.gradle.kts server/src/main server/src/test build.gradle.kts settings.gradle.kts
          grep -Fq 'versionCode = 181' app/build.gradle.kts
          grep -Fq 'applicationId = "app.ft.xa60"' app/build.gradle.kts
          case "$(realpath -e "$GITHUB_WORKSPACE")" in
            /srv/openivi-ci/_work/ft-app/ft-app|/var/lib/openivi-agent/actions-runner/_work/ft-app/ft-app) ;;
            *) echo 'Runner path mismatch' >&2; exit 1 ;;
          esac
      - name: Android tools for independent APK verification
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Reuse signed APK, publish GitHub prerelease, deliver through VPS to Drive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tempfile,urllib.error,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          src=os.environ['SOURCE_PIN']
          name=os.environ['APK_NAME']
          cert=os.environ['CERT_PIN']
          tag='xa60-ft181-a99ed721'
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'ft181-release-delivery'
          dest.mkdir(mode=0o700,parents=True,exist_ok=True)
          apk=dest/name
          candidates=[root/'verified/FT181_XA60_OWNER_SIGNED.apk',
                      root/'verified'/name,
                      root/'app/build/outputs/apk/release/app-release.apk']
          retained=next((p for p in candidates if p.is_file() and p.stat().st_size>1000000 and not p.is_symlink()),None)
          if retained:
              import shutil
              shutil.copyfile(retained,apk)
              print('APK_RECOVERED_FROM='+str(retained),flush=True)
          else:
              print('Original local APK absent; attempting already-uploaded Drive binary',flush=True)
              subprocess.run(['rclone','copyto','openivi-drive:'+name,str(apk),
                  '--retries','2','--low-level-retries','3','--retries-sleep','3s',
                  '--contimeout','15s','--timeout','60s'],check=True,timeout=180)
          assert apk.is_file() and not apk.is_symlink() and apk.stat().st_size>1000000
          btdir=pathlib.Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])/'build-tools/36.0.0'
          def output(cmd,timeout=180):
              return subprocess.check_output([str(x) for x in cmd],stderr=subprocess.STDOUT,timeout=timeout).decode('utf8','replace')
          output(['unzip','-t',apk])
          badging=output([btdir/'aapt','dump','badging',apk])
          assert "package: name='app.ft.xa60' versionCode='181'" in badging
          assert 'application-debuggable' not in badging
          signer=output([btdir/'apksigner','verify','--verbose','--print-certs',apk])
          assert cert.lower() in signer.lower()
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          (dest/'SHA256SUMS').write_text(digest+'  '+name+'\n')
          (dest/'PROVENANCE.txt').write_text('SOURCE_SHA='+src+'\nPACKAGE=app.ft.xa60\nVERSION_CODE=181\nSIGNER_SHA256='+cert+'\nVEHICLE_FIELD=NOT_TESTED\nRUN_FROM=43378689656\n')
          (dest/'apk-badging.txt').write_text(badging)
          (dest/'apksigner.txt').write_text(signer)
          print('OWNER_SIGNED_APK_SHA256='+digest,flush=True)
          base='https://api.github.com/repos/'+repo
          auth={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def request(url,method='GET',data=None,payload=None,ctype=None):
              headers=auth.copy()
              if payload is not None:
                  data=json.dumps(payload).encode()
                  headers['Content-Type']='application/json'
              if ctype: headers['Content-Type']=ctype
              req=urllib.request.Request(url,headers=headers,data=data,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=180) as resp:return json.load(resp)
              except urllib.error.HTTPError as e:
                  if e.code==404 and method=='GET':return None
                  raise
          release=request(base+'/releases/tags/'+tag)
          if release is None:
              release=request(base+'/releases',method='POST',payload={
                  'tag_name':tag,'target_commitish':src,
                  'name':'FT181 XA60 owner-signed field test (a99ed721)',
                  'body':'Owner-signed field APK, app.ft.xa60 v181. Source SHA '+src+
                         '. APK SHA-256 '+digest+'. Owner certificate SHA-256 '+cert+
                         '. Vehicle field test NOT_TESTED. Signed build verified in GitHub Actions run 43378689656.',
                  'draft':False,'prerelease':True})
          assert release['tag_name']==tag
          existing={a['name']:a for a in release.get('assets',[])}
          if name in existing:
              asset=existing[name]
              assert asset['state']=='uploaded' and asset['size']==apk.stat().st_size
              assert asset.get('digest')=='sha256:'+digest
          else:
              u='https://uploads.github.com/repos/'+repo+'/releases/'+str(release['id'])+'/assets?name='+urllib.parse.quote(name)
              asset=request(u,method='POST',data=apk.read_bytes(),ctype='application/vnd.android.package-archive')
          assert asset['state']=='uploaded' and asset['size']==apk.stat().st_size
          if asset.get('digest'):assert asset['digest']=='sha256:'+digest
          reread=request(base+'/releases/tags/'+tag)
          matches=[a for a in reread['assets'] if a['name']==name]
          assert len(matches)==1 and matches[0]['state']=='uploaded'
          assert matches[0]['size']==apk.stat().st_size
          if matches[0].get('digest'):assert matches[0]['digest']=='sha256:'+digest
          print('FT181_RELEASE='+reread['html_url'],flush=True)
          print('FT181_APK_DOWNLOAD='+matches[0]['browser_download_url'],flush=True)
          # Independent bounded rclone upload/readback to the already-rooted CI_BUILDS remote.
          remote='openivi-drive:'+name
          opts=['--retries','2','--low-level-retries','3','--retries-sleep','3s','--contimeout','15s','--timeout','60s','--tpslimit','0.5','--tpslimit-burst','1','--drive-pacer-min-sleep','2s','--drive-pacer-burst','1']
          subprocess.run(['rclone','copyto',str(apk),remote]+opts,check=True,timeout=240)
          actual=hashlib.sha256(subprocess.check_output(['rclone','cat',remote]+opts,timeout=240)).hexdigest()
          assert actual==digest, 'Drive byte-for-byte SHA256 mismatch'
          print('FT181_DRIVE_APK_READBACK_SHA256=PASS',flush=True)
          for fname in ['SHA256SUMS','PROVENANCE.txt','apk-badging.txt','apksigner.txt']:
              path=dest/fname
              rpath='openivi-drive:FT181_a99ed721_'+fname
              subprocess.run(['rclone','copyto',str(path),rpath]+opts,check=True,timeout=90)
              got=hashlib.sha256(subprocess.check_output(['rclone','cat',rpath]+opts,timeout=90)).hexdigest()
              assert got==hashlib.sha256(path.read_bytes()).hexdigest()
          print('FT181_DRIVE_ALL_RECEIPTS=PASS',flush=True)
          import shutil
          shutil.rmtree(dest)
          PY
