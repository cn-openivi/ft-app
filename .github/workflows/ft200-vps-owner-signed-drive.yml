name: FT200 XA60 owner-signed early-test APK to Drive

on:
  push:
    branches:
      - openivi/ft200-carplay-three-backends-20261117
    paths:
      - '.github/workflows/ft200-vps-owner-signed-drive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ft200-owner-signed-drive
  cancel-in-progress: false

jobs:
  build-sign-deliver:
    runs-on: [self-hosted, linux]
    timeout-minutes: 90
    env:
      SOURCE_PIN: cd7003db636c228d7dc28f3dbb162559cb3fb15d
      CERT_PIN: e877ebac8f7938789b6fbac36248a866aeb4803370fe46ad9bd8f397a07f691c
      APK_NAME: FT200_XA60_OWNER_SIGNED_cd7003d.apk
    steps:
      - name: Checkout exact FT200 source and workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce exact FT200 source, version and runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$GITHUB_REPOSITORY" = 'cn-openivi/ft-app'
          test "$GITHUB_REF_NAME" = 'openivi/ft200-carplay-three-backends-20261117'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_PIN" "$GITHUB_SHA"
          changed="$(git diff --name-only "$SOURCE_PIN" "$GITHUB_SHA")"
          expected="$(printf '%s\n' '.github/workflows/ft200-home-windows-owner-signed.yml' '.github/workflows/ft200-vps-owner-signed-drive.yml')"
          test "$changed" = "$expected"
          git diff --quiet "$SOURCE_PIN" "$GITHUB_SHA" -- app/src/main app/src/test app/build.gradle.kts server/src/main server/src/test build.gradle.kts settings.gradle.kts
          grep -Fq 'applicationId = "app.ft.xa60"' app/build.gradle.kts
          grep -Fq 'versionCode = 200' app/build.gradle.kts
          grep -Fq 'versionName = "4.0.0-xa60-ft200-carplay-early-test"' app/build.gradle.kts
          grep -Fq 'CARPLAY("carplay", connectionReady = false)' app/src/main/java/app/ft/core/CarProtocol.kt
          grep -Fq 'carPlayExperimentalSelected' app/src/main/java/app/ft/core/Prefs.kt
          case "$(realpath -e "$GITHUB_WORKSPACE")" in
            /srv/openivi-ci/_work/ft-app/ft-app|/var/lib/openivi-agent/actions-runner/_work/ft-app/ft-app) ;;
            *) echo 'Runner workspace path mismatch' >&2; exit 1 ;;
          esac
          echo "FT200_SOURCE_SHA=$SOURCE_PIN"
          echo "FT200_WORKFLOW_SHA=$GITHUB_SHA"
          echo "FT200_RUNNER=$RUNNER_NAME"

      - name: JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify existing Android 36 SDK or install it
        id: sdk_cache
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/srv/openivi-ci/.android/sdk}}"
          if test -f "$sdk/platforms/android-36/android.jar" &&
             test -x "$sdk/build-tools/36.0.0/aapt" &&
             test -x "$sdk/build-tools/36.0.0/apksigner"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
            echo "FT200_ANDROID36_PREINSTALLED_VERIFIED=true"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "FT200_ANDROID36_PREINSTALLED_VERIFIED=false"
          fi

      - name: Android SDK 36
        if: steps.sdk_cache.outputs.ready != 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Restore existing FT owner signing bundle from GitHub Secrets
        shell: bash
        env:
          FT_XA60_SIGNING_BUNDLE_JSON: ${{ secrets.FT_XA60_SIGNING_BUNDLE_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, sys
          raw = os.environ.get("FT_XA60_SIGNING_BUNDLE_JSON", "")
          if not raw:
              sys.exit("Required existing FT_XA60_SIGNING_BUNDLE_JSON is not available to this run")
          bundle = json.loads(raw)
          assert bundle["format"] == "openivi-ft-xa60-pkcs12-v1"
          assert bundle["alias"] == "openivi_ft_xa60"
          key = base64.b64decode(bundle["keystore_b64"], validate=True)
          assert hashlib.sha256(key).hexdigest() == bundle["keystore_sha256"]
          password = bundle["store_password"]
          assert password and all(c in "0123456789abcdef" for c in password)
          private = pathlib.Path(".ft-xa60")
          private.mkdir(mode=0o700, exist_ok=True)
          keystore = private / "ft-xa60-owner.p12"
          keystore.write_bytes(key)
          keystore.chmod(0o600)
          pw_file = private / "password.txt"
          pw_file.write_text(password)
          pw_file.chmod(0o600)
          props = pathlib.Path("ft-xa60-signing.properties")
          props.write_text("storeFile=.ft-xa60/ft-xa60-owner.p12\nstorePassword="+password+
                          "\nkeyAlias=openivi_ft_xa60\nkeyPassword="+password+"\n")
          props.chmod(0o600)
          PY
          actual="$(keytool -exportcert -alias openivi_ft_xa60 -keystore .ft-xa60/ft-xa60-owner.p12 -storepass:file .ft-xa60/password.txt | sha256sum | awk '{print $1}')"
          test "$actual" = "$CERT_PIN"
          echo "FT_XA60_PINNED_SIGNER_SHA256=$actual"

      - name: Run release unit tests, release lint and assemble owner-signed APK
        shell: bash
        env:
          GRADLE_USER_HOME: /srv/openivi-ci/.gradle-ci
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 --console=plain \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs='-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dkotlin.incremental=false \
            :app:testReleaseUnitTest :app:lintVitalRelease :app:assembleRelease --stacktrace

      - name: Verify FT200 identity, owner signature and prepare provenance
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          test "$(stat -c%s "$apk")" -gt 1000000
          unzip -t "$apk" >/dev/null
          unzip -Z1 "$apk" | grep -Fxq 'classes.dex'
          unzip -Z1 "$apk" | grep -Fxq 'AndroidManifest.xml'
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT="$SDK/build-tools/36.0.0"
          "$BT/aapt" dump badging "$apk" | tee apk-badging.txt
          grep -Fq "package: name='app.ft.xa60' versionCode='200'" apk-badging.txt
          grep -Fq "versionName='4.0.0-xa60-ft200-carplay-early-test'" apk-badging.txt
          if grep -q '^application-debuggable' apk-badging.txt; then
            echo 'Refusing debuggable APK' >&2
            exit 1
          fi
          "$BT/apksigner" verify --verbose --print-certs "$apk" | tee apksigner.txt
          grep -iq "$CERT_PIN" apksigner.txt
          mkdir -p verified
          cp "$apk" "verified/$APK_NAME"
          (cd verified && sha256sum "$APK_NAME" > SHA256SUMS)
          printf 'SOURCE_SHA=%s\nWORKFLOW_SHA=%s\nPACKAGE=app.ft.xa60\nVERSION_CODE=200\nVERSION_NAME=4.0.0-xa60-ft200-carplay-early-test\nSIGNATURE=OWNER_SIGNED\nCERT_SHA256=%s\nFIELD=NOT_TESTED\nRELEASE=NOT_PUBLISHED\n' "$SOURCE_PIN" "$GITHUB_SHA" "$CERT_PIN" > verified/PROVENANCE.txt
          cp apk-badging.txt apksigner.txt verified/
          echo "FT200_SIGNED_APK_SHA256=$(sha256sum "verified/$APK_NAME" | awk '{print $1}')"

      - name: Deliver signed FT200 APK to existing Drive CI_BUILDS folder and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          command -v rclone
          rclone listremotes | grep -Fxq 'openivi-drive:'
          local="verified/$APK_NAME"
          target="openivi-drive:$APK_NAME"
          opts=(--tpslimit 0.5 --tpslimit-burst 1 --drive-pacer-min-sleep 2s --drive-pacer-burst 1 --retries 12 --retries-sleep 30s --low-level-retries 20)
          rclone copyto "$local" "$target" "${opts[@]}"
          expected="$(sha256sum "$local" | cut -d' ' -f1)"
          received="$(rclone cat "$target" "${opts[@]}" | sha256sum | cut -d' ' -f1)"
          test "$expected" = "$received"
          test "$(rclone size "$target" --json "${opts[@]}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["bytes"])')" = "$(stat -c%s "$local")"
          for name in SHA256SUMS PROVENANCE.txt apk-badging.txt apksigner.txt; do
            rpath="openivi-drive:FT200_cd7003d_$name"
            rclone copyto "verified/$name" "$rpath" "${opts[@]}"
            test "$(sha256sum "verified/$name" | cut -d' ' -f1)" = "$(rclone cat "$rpath" "${opts[@]}" | sha256sum | cut -d' ' -f1)"
          done
          echo "FT200_DRIVE_SIGNED_APK_PATH=$target"
          echo "FT200_SIGNED_APK_SHA256=$expected"
          echo "FT200_DRIVE_READBACK_SHA256=PASS"
          echo "FT200_RELEASE=NOT_PUBLISHED"

      - name: Remove local FT200 build outputs after successful Drive readback
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for p in app/build server/build verified; do
            test ! -L "$p"
            if test -d "$p"; then rm -rf -- "$p"; fi
          done
          rm -f apk-badging.txt apksigner.txt
          echo "FT200_VPS_BUILD_CLEANUP_AFTER_DRIVE_READBACK=PASS"

      - name: Remove ephemeral restored signing material
        if: always()
        shell: bash
        run: |
          rm -f ft-xa60-signing.properties .ft-xa60/ft-xa60-owner.p12 .ft-xa60/password.txt
