name: FT191 unsigned candidate - owner signing forbidden

on:
  push:
    branches:
      - openivi/ft191-stabilization-hotfix-20261118
    paths:
      - '.github/workflows/ft191-unsigned-candidate.yml'

permissions:
  contents: read

concurrency:
  group: ft191-unsigned-candidate-build
  cancel-in-progress: false

jobs:
  unsigned-candidate:
    runs-on: [self-hosted, linux]
    timeout-minutes: 90
    steps:
      - name: Checkout exactly the gated FT191 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify approved FT191 source and reject signing material
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$GITHUB_REPOSITORY" = "cn-openivi/ft-app"
          test "$GITHUB_REF_NAME" = "openivi/ft191-stabilization-hotfix-20261118"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_sha=51d1e34605fa208bef30eeb3f3ed6f03852f501a
          git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
          git diff --quiet "$source_sha" "$GITHUB_SHA" -- app server
          grep -Fq 'applicationId = "app.ft.xa60"' app/build.gradle.kts
          grep -Fq 'versionCode = 191' app/build.gradle.kts
          grep -Fq '3.9.77-xa60-ft191-stabilization-hotfix-candidate' app/build.gradle.kts
          test ! -e ft-xa60-signing.properties
          test ! -e .ft-xa60/ft-xa60-owner.p12
          test -f app/src/test/java/app/ft/aa/AaHeadUnitListenAddressTest.kt
          test -f app/src/test/java/app/ft/carlife/CarLifeEncryptionSessionTest.kt
          test -f app/src/test/java/app/ft/iccoa/IccoaMediaNetworkScopeTest.kt
          echo "FT191_APP_SOURCE_CI_PASS_SHA=$source_sha"
          echo "FT191_UNSIGNED_BUILD_SOURCE_SHA=$GITHUB_SHA"
          echo "OWNER_SIGNING=FORBIDDEN"

      - name: Guard runner free disk without administrative cleanup
        shell: bash
        run: |
          set -euo pipefail
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          test -n "$available_kib"
          if test "$available_kib" -lt 6291456; then
            echo "NEED_6_GiB_FREE; refusing unsigned build without space" >&2
            exit 1
          fi

      - name: JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Full FT191 JUnit and unsignedTransit APK only
        shell: bash
        env:
          GRADLE_USER_HOME: /srv/openivi-ci/.gradle-ci
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 --console=plain \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs='-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dkotlin.incremental=false \
            :app:compileUnsignedTransitKotlin \
            :app:testUnsignedTransitUnitTest \
            :app:assembleUnsignedTransit --stacktrace

      - name: Check all JUnit results and strictly unsigned app identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          folder = Path('app/build/test-results/testUnsignedTransitUnitTest')
          files = sorted(folder.glob('TEST-*.xml'))
          assert files, 'No FT191 JUnit XML output'
          required = ('AaHeadUnitListenAddressTest', 'CarLifeEncryptionSessionTest',
                      'IccoaMediaNetworkScopeTest', 'AaBoundedSendQueueTest',
                      'IccoaUtf8FramesTest', 'IccoaDirectRecoveryPolicyTest')
          for cls in required:
              assert list(folder.glob('*'+cls+'*.xml')), cls + ' suite missing'
          suites = [ET.parse(p).getroot() for p in files]
          totals = {k: sum(int(s.get(k, 0)) for s in suites)
                    for k in ('tests', 'failures', 'errors', 'skipped')}
          print('FT191_UNSIGNED_CANDIDATE_JUNIT=' + str(totals))
          assert totals['tests'] >= 1136
          assert totals['failures'] == totals['errors'] == totals['skipped'] == 0
          PY
          mapfile -t candidates < <(find app/build/outputs/apk/unsignedTransit -maxdepth 2 -type f -name '*.apk')
          test "${#candidates[@]}" -eq 1
          apk="${candidates[0]}"
          test "$(stat -c%s "$apk")" -gt 1000000
          unzip -t "$apk" >/dev/null
          unzip -Z1 "$apk" | grep -Fxq classes.dex
          unzip -Z1 "$apk" | grep -Fxq AndroidManifest.xml
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$apk" > apk-badging.txt
          grep -Fq "package: name='app.ft.xa60' versionCode='191'" apk-badging.txt
          if grep -q '^application-debuggable' apk-badging.txt; then
            echo "Refusing debuggable FT191 candidate" >&2
            exit 1
          fi
          if "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify "$apk"; then
            echo "Refusing accidentally signed FT191 artifact" >&2
            exit 1
          fi
          mkdir -p verified
          cp "$apk" verified/FT191_XA60_UNSIGNED_CANDIDATE.apk
          sha256sum verified/FT191_XA60_UNSIGNED_CANDIDATE.apk > verified/SHA256SUMS
          printf 'SOURCE_CI_SHA=51d1e34605fa208bef30eeb3f3ed6f03852f501a\nBUILD_COMMIT_SHA=%s\nAPP_ID=app.ft.xa60\nVERSION_CODE=191\nSIGNED=NO\nFIELD=NOT_TESTED\nRELEASE=NOT_AUTHORIZED\n' "$GITHUB_SHA" > verified/PROVENANCE.txt
          echo "FT191_UNSIGNED_CANDIDATE_PASS=$GITHUB_SHA"
          echo "OWNER_SIGNED_APK=NOT_BUILT"
          echo "HU_FIELD=NOT_TESTED"

      - name: Upload short-lived unsigned archive (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ft191-unsigned-candidate-${{ github.sha }}
          path: verified/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove only workspace build outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for p in app/build server/build; do
            if test -d "$p" && test ! -L "$p"; then rm -rf -- "$p"; fi
          done
