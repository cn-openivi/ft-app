name: FT182 signed APK export to GitHub and direct Drive transfer
on:
  push:
    branches:
      - openivi/ft182-supercast-ux-source-20261113
    paths:
      - .github/workflows/ft182-vps-export-apk.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ft182-vps-export-apk
  cancel-in-progress: true
jobs:
  export-owner-signed:
    runs-on: [self-hosted, linux]
    timeout-minutes: 80
    env:
      FT182_CERT_PIN: e877ebac8f7938789b6fbac36248a866aeb4803370fe46ad9bd8f397a07f691c
    steps:
      - name: Checkout without deleting retained signed APK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - name: Verify approved FT182 exact-source and runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$GITHUB_REPOSITORY" = 'cn-openivi/ft-app'
          test "$GITHUB_REF_NAME" = 'openivi/ft182-supercast-ux-source-20261113'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 6b837efcab4e212754f13aeb5f60d1dd533fd7e8 "$GITHUB_SHA"
          git diff --quiet 6b837efcab4e212754f13aeb5f60d1dd533fd7e8 "$GITHUB_SHA" -- app/src server/src app/build.gradle.kts server/build.gradle.kts
          grep -Fq 'versionCode = 182' app/build.gradle.kts
          case "$(realpath -e "$GITHUB_WORKSPACE")" in
            /srv/openivi-ci/_work/ft-app/ft-app|/var/lib/openivi-agent/actions-runner/_work/ft-app/ft-app) ;;
            *) echo UNAPPROVED_RUNNER_WORKSPACE >&2; exit 1 ;;
          esac
      - name: JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Recover exact signed FT182 APK and verify identity signature SHA256
        shell: bash
        env:
          FT_XA60_SIGNING_BUNDLE_JSON: ${{ secrets.FT_XA60_SIGNING_BUNDLE_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,shutil,subprocess,sys
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          cert=os.environ["FT182_CERT_PIN"]
          dest=root/"verified"
          dest.mkdir(exist_ok=True)
          out=dest/"FT182_XA60_OWNER_SIGNED_6b837efc.apk"
          candidates=[
           root/"verified/FT182_XA60_OWNER_SIGNED.apk",
           root/"app/build/outputs/apk/release/app-release.apk",
           pathlib.Path("/srv/openivi-ci/_work/_temp/ft182-delivery-recovery/FT182_XA60_OWNER_SIGNED_6b837efc.apk")
          ]
          src=next((p for p in candidates if p.is_file() and not p.is_symlink() and p.stat().st_size>1000000),None)
          if src is None:
           print("SIGNED_APK_NOT_RETAINED: rebuilding exact pinned FT182 source",flush=True)
           raw=os.environ.get("FT_XA60_SIGNING_BUNDLE_JSON","")
           assert raw,"OWNER_SIGNER_SECRET_UNAVAILABLE"
           bundle=json.loads(raw)
           assert bundle["format"]=="openivi-ft-xa60-pkcs12-v1"
           assert bundle["alias"]=="openivi_ft_xa60"
           key=base64.b64decode(bundle["keystore_b64"],validate=True)
           assert hashlib.sha256(key).hexdigest()==bundle["keystore_sha256"]
           private=root/".ft-xa60"
           private.mkdir(mode=0o700,exist_ok=True)
           keyfile=private/"ft-xa60-owner.p12"
           keyfile.write_bytes(key);keyfile.chmod(0o600)
           pw=bundle["store_password"]
           prop=root/"ft-xa60-signing.properties"
           prop.write_text("storeFile=.ft-xa60/ft-xa60-owner.p12\nstorePassword="+pw+"\nkeyAlias=openivi_ft_xa60\nkeyPassword="+pw+"\n")
           prop.chmod(0o600)
           try:
            subprocess.run(["./gradlew","--no-daemon","--max-workers=1","--console=plain",
             "-Dorg.gradle.parallel=false","-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8",
             "-Dkotlin.compiler.execution.strategy=in-process",":app:testReleaseUnitTest",":app:lintVitalRelease",":app:assembleRelease"],
             cwd=root,timeout=1800,check=True)
           finally:
            prop.unlink(missing_ok=True)
            keyfile.unlink(missing_ok=True)
           src=root/"app/build/outputs/apk/release/app-release.apk"
          assert src.is_file() and not src.is_symlink() and src.stat().st_size>1000000
          shutil.copyfile(src,out)
          sdk=pathlib.Path(os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/srv/openivi-ci/.android/sdk")
          bt=sdk/"build-tools/36.0.0"
          def result(args):
           return subprocess.check_output(list(map(str,args)),stderr=subprocess.STDOUT,timeout=150).decode("utf-8","replace")
          result(["unzip","-t",out])
          badging=result([bt/"aapt","dump","badging",out])
          assert "package: name='app.ft.xa60' versionCode='182'" in badging,"APK_PACKAGE_OR_VERSION_WRONG"
          assert "application-debuggable" not in badging,"DEBUG_APK_REFUSED"
          sign=result([bt/"apksigner","verify","--verbose","--print-certs",out])
          assert cert.lower() in sign.lower(),"OWNER_SIGNER_MISMATCH"
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          (dest/"SHA256SUMS").write_text(digest+"  "+out.name+"\n")
          (dest/"PROVENANCE.txt").write_text("FT182_SOURCE_SHA=6b837efcab4e212754f13aeb5f60d1dd533fd7e8\nAPP_ID=app.ft.xa60\nVERSION_CODE=182\nCERT_SHA256="+cert+"\nAPK_SHA256="+digest+"\nFIELD=NOT_TESTED\n")
          (dest/"apk-badging.txt").write_text(badging)
          (dest/"apksigner.txt").write_text(sign)
          print("FT182_APK_SIGNED_VERIFIED=PASS",flush=True)
          print("FT182_APK_SHA256="+digest,flush=True)
          PY
      - name: Export owner-signed FT182 APK and checksums as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FT182_XA60_OWNER_SIGNED_6b837efc
          path: |
            verified/FT182_XA60_OWNER_SIGNED_6b837efc.apk
            verified/SHA256SUMS
            verified/PROVENANCE.txt
            verified/apk-badging.txt
            verified/apksigner.txt
          if-no-files-found: error
          retention-days: 10
      - name: Publish GitHub prerelease from verified signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.error,urllib.parse,urllib.request,time
          repo=os.environ["GITHUB_REPOSITORY"]
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          apk=root/"verified/FT182_XA60_OWNER_SIGNED_6b837efc.apk"
          assert apk.is_file() and apk.stat().st_size>1000000
          sha=hashlib.sha256(apk.read_bytes()).hexdigest()
          tag="xa60-ft182-6b837efc"
          pin="6b837efcab4e212754f13aeb5f60d1dd533fd7e8"
          api="https://api.github.com/repos/"+repo
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"OpenIVI-FT182-Bounded-Release"}
          def gh(method,url,body=None,ctype="application/json",timeout=120):
           data=None if body is None else (body if isinstance(body,bytes) else json.dumps(body).encode())
           h=dict(headers)
           if data is not None:h["Content-Type"]=ctype
           with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h,method=method),timeout=timeout) as r:return json.load(r)
          try:
           release=gh("GET",api+"/releases/tags/"+tag)
          except urllib.error.HTTPError as e:
           if e.code!=404:raise
           existing=gh("GET",api+"/releases?per_page=60")
           release=next((item for item in existing if item.get("tag_name")==tag),None)
           if release is None:
            note=(root/"docs/releases/FT182.ru.md").read_text("utf-8") if (root/"docs/releases/FT182.ru.md").exists() else "Подписанная тестовая сборка FT182. Полевые проверки на ГУ ещё не выполнены."
            note+="\n\nИсточник: "+pin+"\nSHA-256 APK: "+sha+"\nПодпись владельца: "+os.environ["FT182_CERT_PIN"]+"\n"
            release=gh("POST",api+"/releases",{"tag_name":tag,"target_commitish":pin,"name":"FT182 — управление Android Auto и упрощённая настройка телефона","body":note,"draft":True,"prerelease":True})
           else:
            print("FT182_EXISTING_DRAFT_REUSED="+str(release["id"]),flush=True)
          assert release["tag_name"]==tag and release["target_commitish"]==pin
          asset_name=apk.name
          def find_asset():
           reread=gh("GET",api+"/releases/"+str(release["id"]))
           return reread,next((a for a in reread.get("assets",[]) if a["name"]==asset_name and a.get("state")=="uploaded"),None)
          release,asset=find_asset()
          if asset is None:
           upload=release["upload_url"].split("{",1)[0]+"?name="+urllib.parse.quote(asset_name)
           last=None
           for attempt in range(2):
            try:
             asset=gh("POST",upload,apk.read_bytes(),"application/vnd.android.package-archive",timeout=600)
             break
            except Exception as e:
             last=e
             release,asset=find_asset()
             if asset is not None:break
             print("GITHUB_UPLOAD_ATTEMPT_FAILED="+str(e)[:400],flush=True)
           if asset is None:raise RuntimeError("GITHUB_ASSET_UPLOAD_FAILED "+str(last)[:250])
          assert asset["state"]=="uploaded" and asset["size"]==apk.stat().st_size
          assert asset.get("digest")=="sha256:"+sha
          if release["draft"]:
           release=gh("PATCH",api+"/releases/"+str(release["id"]),{"draft":False,"prerelease":True})
          release,asset=find_asset()
          assert not release["draft"] and release["prerelease"]
          assert asset is not None and asset.get("digest")=="sha256:"+sha
          print("FT182_GITHUB_RELEASE="+release["html_url"],flush=True)
          print("FT182_GITHUB_APK="+asset["browser_download_url"],flush=True)
          print("FT182_GITHUB_SHA256_READBACK=PASS",flush=True)
          PY
