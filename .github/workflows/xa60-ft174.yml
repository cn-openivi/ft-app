name: FT XA60 build 174 (GPS / Android Auto / ICCOA field test)

on:
  push:
    branches: [openivi/ft174-field-20261103]
    paths:
      - '.github/workflows/xa60-ft174.yml'
      - 'app/**'
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ft-xa60-build174
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GRADLE_USER_HOME: /home/runner/.gradle-ft-xa60
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify isolated hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" != "0"
          df -h /
          free -h

      - name: Checkout exact FT174 source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Pin and audit FT174 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'versionCode = 174' app/build.gradle.kts
          grep -Fq 'applicationId = "app.ft.xa60"' app/build.gradle.kts
          grep -Fq 'IccoaCloseEvent.classify' app/src/main/java/app/ft/iccoa/IccoaSession.kt
          grep -Fq 'IccoaCloseAction.REQUIRE_NORMAL_PIN' app/src/main/java/app/ft/iccoa/IccoaService.kt
          grep -Fq 'Chip(CarIcons.Compass' app/src/main/java/app/ft/ui/car/CarWidgets.kt
          grep -Fq 'CarGpsSourceSelector()' app/src/main/java/app/ft/ui/car/CarWidgets.kt
          grep -Fq 'VehicleTelemetry.publish' app/src/main/java/app/ft/iccoa/IccoaService.kt
          grep -Fq 'gpsGate.accept(car, now)' app/src/main/java/app/ft/aa/AaSession.kt
          grep -Fq 'IccoaClientIdentity.load()' app/src/main/java/app/ft/iccoa/IccoaSession.kt
          echo "FT174_SOURCE_SHA=$GITHUB_SHA"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Restore and verify owner-controlled FT XA60 signer
        shell: bash
        env:
          FT_XA60_SIGNING_BUNDLE_JSON: ${{ secrets.FT_XA60_SIGNING_BUNDLE_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, sys
          raw = os.environ.get("FT_XA60_SIGNING_BUNDLE_JSON", "")
          if not raw:
              sys.exit("Missing owner signing bundle GitHub Secret")
          bundle = json.loads(raw)
          assert bundle["format"] == "openivi-ft-xa60-pkcs12-v1"
          assert bundle["alias"] == "openivi_ft_xa60"
          key = base64.b64decode(bundle["keystore_b64"], validate=True)
          assert hashlib.sha256(key).hexdigest() == bundle["keystore_sha256"]
          password = bundle["store_password"]
          assert password and all(c in "0123456789abcdef" for c in password)
          private = pathlib.Path(".ft-xa60")
          private.mkdir(mode=0o700, exist_ok=True)
          keystore = private / "ft-xa60-owner.p12"
          keystore.write_bytes(key)
          keystore.chmod(0o600)
          pw_file = private / "password.txt"
          pw_file.write_text(password)
          pw_file.chmod(0o600)
          props = pathlib.Path("ft-xa60-signing.properties")
          props.write_text("storeFile=.ft-xa60/ft-xa60-owner.p12\nstorePassword="+password+
                           "\nkeyAlias=openivi_ft_xa60\nkeyPassword="+password+"\n")
          props.chmod(0o600)
          PY
          actual=$(keytool -exportcert -alias openivi_ft_xa60 -keystore .ft-xa60/ft-xa60-owner.p12 -storepass:file .ft-xa60/password.txt | sha256sum | awk '{print $1}')
          expected=e877ebac8f7938789b6fbac36248a866aeb4803370fe46ad9bd8f397a07f691c
          test "$actual" = "$expected"
          echo "FT_XA60_PINNED_SIGNER_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Bounded Gradle memory configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME"
          cat > "$GRADLE_USER_HOME/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2304m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.caching=false
          org.gradle.configuration-cache=false
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental=false
          EOF

      - name: Verify FT174 unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 testDebugUnitTest --stacktrace

      - name: Compile owner-signed non-debuggable release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=1 lintVitalRelease assembleRelease --stacktrace

      - name: Validate exact APK / pinned certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/ft-apksigner.txt"
          grep -iq "$FT_XA60_PINNED_SIGNER_SHA256" "$RUNNER_TEMP/ft-apksigner.txt"
          "$bt/aapt" dump badging "$apk" | grep -m1 "^package: name='app.ft.xa60' versionCode='174'"
          if "$bt/aapt" dump badging "$apk" | grep -q '^application-debuggable'; then
            echo 'REFUSE: release APK is debuggable' >&2
            exit 1
          fi
          sha256sum "$apk" | tee "$RUNNER_TEMP/ft-sha256.txt"
          echo "FT_APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Publish verified FT174 prerelease and APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.error, urllib.parse, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          apk = pathlib.Path(os.environ["FT_APK_PATH"])
          checksum = hashlib.sha256(apk.read_bytes()).hexdigest()
          tag = "xa60-ft174-" + sha[:12]
          base = "https://api.github.com/repos/" + repo
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }
          def github(url, method="GET", obj=None, data=None, content_type=None):
              h = dict(headers)
              if content_type: h["Content-Type"] = content_type
              if obj is not None:
                  data = json.dumps(obj).encode()
                  h["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  if e.code == 404 and method == "GET": return None
                  raise
          release = github(base + "/releases/tags/" + tag)
          if release is None:
              release = github(base + "/releases", method="POST", obj={
                  "tag_name": tag, "target_commitish": sha,
                  "name": "FT 174 XA60 field test " + sha[:12],
                  "body": "Owner-signed FT174 field candidate. VersionCode 174, app.ft.xa60. Source-only compile/unit verified before release. Vehicle acceptance and AA LOCATION subscription remain unconfirmed. APK SHA-256: " + checksum + ". Certificate SHA-256: e877ebac8f7938789b6fbac36248a866aeb4803370fe46ad9bd8f397a07f691c.",
                  "prerelease": True, "draft": False
              })
          filename = "ft-174-xa60-" + sha[:12] + ".apk"
          existing = {item["name"]: item for item in release.get("assets", [])}
          if filename in existing:
              asset = existing[filename]
              if asset["size"] != apk.stat().st_size or asset.get("digest") not in ("sha256:" + checksum, None):
                  raise RuntimeError("Existing APK conflicts with this exact commit")
          else:
              uploads = "https://uploads.github.com/repos/" + repo + "/releases/" + str(release["id"]) + "/assets?name=" + urllib.parse.quote(filename)
              asset = github(uploads, method="POST", data=apk.read_bytes(), content_type="application/vnd.android.package-archive")
          if asset.get("state") != "uploaded":
              raise RuntimeError("APK upload not terminal: " + str(asset.get("state")))
          print("FT174_APK_DOWNLOAD=" + asset["browser_download_url"])
          print("FT174_APK_SHA256=" + checksum)
          print("FT174_RELEASE=" + release["html_url"])
          PY
