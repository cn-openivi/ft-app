name: FT188 Direct-first post-PAUSE source-only gate

on:
  push:
    branches:
      - openivi/ft188-direct-first-20261115
    paths:
      - 'app/**'
      - '.github/workflows/ft188-direct-first-source-only.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ft188-direct-first-source-only
  cancel-in-progress: true

jobs:
  source-only:
    runs-on: [self-hosted, linux]
    timeout-minutes: 70
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate branch, policy and no-signing contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$GITHUB_REPOSITORY" = "cn-openivi/ft-app"
          test "$GITHUB_REF_NAME" = "openivi/ft188-direct-first-20261115"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'applicationId = "app.ft.xa60"' app/build.gradle.kts
          grep -Fq 'versionCode = 187' app/build.gradle.kts
          grep -Fq 'DIRECT_VIDEO_POST_PAUSE_RECOVERED' app/src/main/java/app/ft/iccoa/IccoaDirectVideo.kt
          grep -Fq 'FT_encoder_stays_off=true' app/src/main/java/app/ft/iccoa/IccoaDirectVideo.kt
          test -f app/src/test/java/app/ft/iccoa/IccoaDirectRecoveryPolicyTest.kt
          test -f app/src/main/java/app/ft/iccoa/IccoaOemWheelKey.kt
          test -f app/src/test/java/app/ft/iccoa/IccoaOemWheelKeyTest.kt
          test -f app/src/test/java/app/ft/iccoa/IccoaDrSourceGapEvidenceTest.kt
          test -f app/src/test/java/app/ft/iccoa/IccoaDrInputBridgeTest.kt
          grep -Fq 'dr-source-gaps.txt' app/src/main/java/app/ft/core/DiagReport.kt
          grep -Fq 'IccoaOemWheelKey.CONTROL_METHOD' app/src/main/java/app/ft/iccoa/IccoaService.kt
          echo "FT188_STAGE_SOURCE_SHA=$GITHUB_SHA"
      - name: JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Compile Kotlin and run full FT188 unsigned JUnit suite
        shell: bash
        env:
          GRADLE_USER_HOME: /srv/openivi-ci/.gradle-ci
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 --console=plain \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs='-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dkotlin.incremental=false \
            :app:compileUnsignedTransitKotlin \
            :app:testUnsignedTransitUnitTest --stacktrace
      - name: Require full JUnit and P0 regressions without creating an APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          folder=Path('app/build/test-results/testUnsignedTransitUnitTest')
          names=('IccoaDirectRecoveryPolicyTest','IccoaOemWheelKeyTest','IccoaDrSourceGapEvidenceTest','IccoaDrInputBridgeTest','StringsTest','IccoaMediaTest','IccoaWfdAvcTest','CarUiViewportTest','FtUiScaleStepTest')
          paths=[]
          for name in names:
            matches=list(folder.glob('*'+name+'*.xml'))
            assert matches, name+' test XML absent'
            paths.extend(matches)
          all_paths=list(folder.glob('TEST-*.xml'))
          assert all_paths, 'Full test XML results absent'
          suites=[ET.parse(p).getroot() for p in all_paths]
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          print('FT188_FULL_UNSIGNED_JUNIT='+str(totals))
          print('FT188_REQUIRED_TEST_CLASSES='+str(names))
          assert totals['tests'] >= 1000 and totals['failures'] == 0 and totals['errors'] == 0
          PY
          if find app/build/outputs/apk -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo 'Source-only test MUST NOT produce an APK' >&2
            exit 1
          fi
          echo "FT188_DIRECT_SOURCE_ONLY_PASS=$GITHUB_SHA"
          echo "FULL_JUNIT=PASS; FT187_KNOWN_6_FAILURES_RECHECKED=YES"
          echo "SIGNED_APK=NOT_BUILT"
          echo "HU_FIELD=NOT_TESTED"
      - name: Clean workspace build outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for p in app/build server/build; do
            if test -d "$p" && test ! -L "$p"; then rm -rf -- "$p"; fi
          done
