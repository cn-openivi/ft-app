name: FT W1-W5 exact-SHA source-only regression

on:
  # A PR-triggered run can be independently read back with the existing
  # GitHub connector; a push-only run cannot be inspected through it.
  pull_request:
    branches:
      - openivi/ft-inertial-widget-dr-design-20261103
    paths:
      - '.github/workflows/ft-ci-w1-w5-source-only.yml'

permissions:
  contents: read

concurrency:
  group: ft-w1-w5-source-only-20261105
  cancel-in-progress: false

jobs:
  source-only:
    name: Five worker SHAs and integrated source - unit tests only
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GRADLE_USER_HOME: /home/runner/.gradle-ft-worker-unit
    steps:
      - name: Checkout full source history without saved credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Compile and run the unit suite for each exact worker SHA (NO APK)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME"
          cat > "$GRADLE_USER_HOME/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2304m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental=false
          EOF

          checks=(
            'W1:c96ad635b7aba6a68f350b9dd507d634c2067c1d'
            'W2:df7753120c26b6cd1b6af47437879c56f82c6336'
            'W3:9bbbc21bd494b9a258ebc2b53db63a7f0abf6f3e'
            'W4:058ae14d159bebf53112f8a4f770424fff98deed'
            'W5:92324359ecfb9488ff3d0c86799347402c5e7fde'
            'INTEGRATED:8479b3d945b077215767de2f64852378fd4cef28'
          )
          echo '### Exact source SHA results (no APK)' >> "$GITHUB_STEP_SUMMARY"
          echo '| Worker | SHA | Gradle compile + unit | APK guard |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          overall=0
          for item in "${checks[@]}"; do
            worker="${item%%:*}"
            sha="${item#*:}"
            echo "::group::${worker} ${sha}"
            git checkout --force --detach "$sha"
            git clean -ffdx
            actual="$(git rev-parse HEAD)"
            if [[ "$actual" != "$sha" ]]; then
              echo "::error::Checkout SHA mismatch for ${worker}: ${actual}"
              exit 1
            fi
            chmod +x gradlew
            gradle_result=FAIL
            if ./gradlew --no-daemon --max-workers=1 :app:testUnsignedTransitUnitTest --stacktrace; then
              gradle_result=PASS
            else
              overall=1
            fi
            apk_result=PASS
            if find app/build/outputs/apk -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
              echo "::error::Unexpected APK output under ${worker} ${sha}"
              apk_result=FAIL
              overall=1
            fi
            echo "| ${worker} | \`${sha}\` | ${gradle_result} | ${apk_result} |" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done
          exit "$overall"
