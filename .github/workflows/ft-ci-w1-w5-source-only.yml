name: FT contribution 3 PR exact-SHA source-only regression

on:
  push:
    branches:
      - openivi/ft-contrib-three-ci-source-only-20261105
    paths:
      - '.github/workflows/ft-ci-w1-w5-source-only.yml'

permissions:
  contents: read

concurrency:
  group: ft-contrib-three-source-only-20261105
  cancel-in-progress: false

jobs:
  source-only:
    name: Three isolated upstream-based SHA unit tests only
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GRADLE_USER_HOME: /home/runner/.gradle-ft-worker-unit
    steps:
      - name: Checkout full source history without saved credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Compile and run the unit suite for each exact worker SHA (NO APK)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME"
          cat > "$GRADLE_USER_HOME/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2304m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental=false
          EOF

          checks=(
            'AA_TOUCH:1927bf218a3143aab3e1db856c5a30ecb9853ee1'
            'AA_H264:e9b2df5a0a88866a516e89fedd106d99d4d87b4b'
            'MIRROR_AUDIO:62dc30fa8d977ef0a3ab22331eabf08f56f364f6'
          )
          echo '### Exact source SHA results (no APK)' >> "$GITHUB_STEP_SUMMARY"
          echo '| Worker | SHA | Gradle compile + unit | APK guard |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          overall=0
          for item in "${checks[@]}"; do
            worker="${item%%:*}"
            sha="${item#*:}"
            echo "::group::${worker} ${sha}"
            git checkout --force --detach "$sha"
            git clean -ffdx
            actual="$(git rev-parse HEAD)"
            if [[ "$actual" != "$sha" ]]; then
              echo "::error::Checkout SHA mismatch for ${worker}: ${actual}"
              exit 1
            fi
            chmod +x gradlew
            gradle_result=FAIL
            if ./gradlew --no-daemon --max-workers=1 :app:testUnsignedTransitUnitTest --stacktrace; then
              gradle_result=PASS
            else
              overall=1
            fi
            apk_result=PASS
            if find app/build/outputs/apk -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
              echo "::error::Unexpected APK output under ${worker} ${sha}"
              apk_result=FAIL
              overall=1
            fi
            echo "| ${worker} | \`${sha}\` | ${gradle_result} | ${apk_result} |" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done
          exit "$overall"
