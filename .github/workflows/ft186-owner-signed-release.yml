name: FT186 XA60 guarded owner-signed field candidate to GitHub and Drive
on:
  push:
    branches:
      - openivi/ft186-signed-release-20261114
    paths:
      - '.github/workflows/ft186-owner-signed-release.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: ft186-xa60-owner-signed-one-shot-release
  cancel-in-progress: true

jobs:
  signed-release:
    runs-on: [self-hosted, linux]
    timeout-minutes: 90
    env:
      SOURCE_PIN: 767569f5a86fc367929a95846b39b639b479cdd0
      CERT_PIN: e877ebac8f7938789b6fbac36248a866aeb4803370fe46ad9bd8f397a07f691c
      TAG_NAME: xa60-ft186-767569f5
      APK_NAME: FT186_XA60_OWNER_SIGNED_767569f5.apk
    steps:
      - name: Checkout immutable FT186 source plus release notes/workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard owner-authorized exact FT186 source, one-shot release branch and runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$GITHUB_REPOSITORY" = 'cn-openivi/ft-app'
          test "$GITHUB_REF_NAME" = 'openivi/ft186-signed-release-20261114'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_PIN" "$GITHUB_SHA"
          diff -u <(printf '%s\n' '.github/workflows/ft186-owner-signed-release.yml' 'docs/releases/FT186.ru.md' | sort) <(git diff --name-only "$SOURCE_PIN" "$GITHUB_SHA" | sort)
          grep -Fq 'applicationId = "app.ft.xa60"' app/build.gradle.kts
          grep -Fq 'versionCode = 186' app/build.gradle.kts
          grep -Fq 'versionName = "3.9.72-xa60-ft186-iccoa-bt-source"' app/build.gradle.kts
          test -s docs/releases/FT186.ru.md
          echo "FT186_SIGNED_RELEASE_SOURCE_PIN=$SOURCE_PIN"
          echo "FT186_SIGNED_RELEASE_WORKFLOW_SHA=$GITHUB_SHA"
      - name: Gate on exact successful FT186 source-only CI run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          source=os.environ['SOURCE_PIN']
          run_id='43600071921'
          url='https://api.github.com/repos/'+repo+'/actions/runs/'+run_id
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for n in range(45):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as response:
                  result=json.load(response)
              assert result['head_sha']==source and result['head_branch']=='openivi/ft186-field-p0-video-pairing-20261114', 'Unrelated source-only CI receipt'
              if result['status']=='completed':
                  assert result['conclusion']=='success', 'FT186 SOURCE_ONLY gate failed: '+str(result['conclusion'])
                  print('FT186_SOURCE_ONLY_CI=PASS run='+run_id+' sha='+source,flush=True)
                  break
              time.sleep(20)
          else:
              raise SystemExit('FT186 source-only CI did not complete within bounded wait; refusing signed release')
          PY
      - name: JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK build-tools 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Restore the existing owner signing certificate, never generate a new signing key
        shell: bash
        env:
          FT_XA60_SIGNING_BUNDLE_JSON: ${{ secrets.FT_XA60_SIGNING_BUNDLE_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, sys
          raw=os.environ.get('FT_XA60_SIGNING_BUNDLE_JSON','')
          if not raw: sys.exit('Missing existing FT signing bundle; refusing unsigned or newly signed fallback')
          bundle=json.loads(raw)
          assert bundle['format']=='openivi-ft-xa60-pkcs12-v1'
          assert bundle['alias']=='openivi_ft_xa60'
          key=base64.b64decode(bundle['keystore_b64'],validate=True)
          assert hashlib.sha256(key).hexdigest()==bundle['keystore_sha256']
          password=bundle['store_password']
          assert password and all(c in '0123456789abcdef' for c in password)
          d=pathlib.Path('.ft-xa60')
          d.mkdir(mode=0o700,exist_ok=True)
          f=d/'ft-xa60-owner.p12'
          f.write_bytes(key);f.chmod(0o600)
          pw=d/'password.txt'
          pw.write_text(password);pw.chmod(0o600)
          p=pathlib.Path('ft-xa60-signing.properties')
          p.write_text('storeFile=.ft-xa60/ft-xa60-owner.p12\nstorePassword='+password+'\nkeyAlias=openivi_ft_xa60\nkeyPassword='+password+'\n')
          p.chmod(0o600)
          PY
          actual="$(keytool -exportcert -alias openivi_ft_xa60 -keystore .ft-xa60/ft-xa60-owner.p12 -storepass:file .ft-xa60/password.txt | sha256sum | cut -d' ' -f1)"
          test "$actual" = "$CERT_PIN"
          echo "FT186_OWNER_SIGNING_CERT_PIN_MATCH=PASS"
      - name: Compile FT186 release, run release JVM tests and lint, assemble signed APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 --console=plain \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs='-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dkotlin.incremental=false \
            :app:testReleaseUnitTest :app:lintVitalRelease :app:assembleRelease
      - name: Verify owner certificate, upgrade package, version, unit results and exact APK digest
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          test "$(stat -c%s "$apk")" -gt 1000000
          unzip -t "$apk" >/dev/null
          unzip -Z1 "$apk" | grep -Fxq classes.dex
          unzip -Z1 "$apk" | grep -Fxq AndroidManifest.xml
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$apk" > "$RUNNER_TEMP/ft186-badging.txt"
          grep -Fq "package: name='app.ft.xa60' versionCode='186'" "$RUNNER_TEMP/ft186-badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/ft186-badging.txt"; then echo 'Refusing debuggable release' >&2; exit 1; fi
          "$BT/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/ft186-apksigner.txt"
          grep -iq "$CERT_PIN" "$RUNNER_TEMP/ft186-apksigner.txt"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=sorted(Path('app/build/test-results/testReleaseUnitTest').glob('TEST-*.xml'))
          assert files,'Missing signed-release test XML'
          totals={k:sum(int(ET.parse(f).getroot().get(k,0)) for f in files) for k in ('tests','failures','errors','skipped')}
          print('FT186_RELEASE_JUNIT_TOTALS='+str(totals),flush=True)
          assert totals['tests']>=900 and totals['failures']==0 and totals['errors']==0
          PY
          mkdir -p verified
          cp "$apk" "verified/$APK_NAME"
          sha256sum "verified/$APK_NAME" > verified/SHA256SUMS
          apk_sha="$(sha256sum "verified/$APK_NAME" | cut -d' ' -f1)"
          printf 'SOURCE_SHA=%s\nCI_SHA=%s\nAPP_ID=app.ft.xa60\nVERSION_CODE=186\nOWNER_CERT_SHA256=%s\nAPK_SHA256=%s\nFIELD=NOT_TESTED\n' "$SOURCE_PIN" "$GITHUB_SHA" "$CERT_PIN" "$apk_sha" > verified/PROVENANCE.txt
          cp "$RUNNER_TEMP/ft186-badging.txt" verified/apk-badging.txt
          cp "$RUNNER_TEMP/ft186-apksigner.txt" verified/apksigner.txt
          echo "FT186_SIGNED_APK_SHA256=$apk_sha"
          echo 'FT186_RELEASE_VERIFY=PASS'
      - name: Publish verified FT186 prerelease with Russian description to GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.error,urllib.parse,urllib.request
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          apk=root/'verified'/os.environ['APK_NAME']
          sha=hashlib.sha256(apk.read_bytes()).hexdigest()
          notes=(root/'docs/releases/FT186.ru.md').read_text(encoding='utf-8')
          footer='\n\n---\n**Проверенная сборка**\n\n- Источник: `'+os.environ['SOURCE_PIN']+'`\n- APK SHA-256: `'+sha+'`\n- Сертификат владельца SHA-256: `'+os.environ['CERT_PIN']+'`\n- Полевые испытания: **ещё не проводились**.\n'
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def request(url,method='GET',payload=None,data=None,ctype=None):
              h=headers.copy()
              if payload is not None:
                  data=json.dumps(payload,ensure_ascii=False).encode('utf-8')
                  h['Content-Type']='application/json; charset=utf-8'
              if ctype: h['Content-Type']=ctype
              q=urllib.request.Request(url,headers=h,data=data,method=method)
              try:
                  with urllib.request.urlopen(q,timeout=180) as resp: return json.load(resp)
              except urllib.error.HTTPError as e:
                  if method=='GET' and e.code==404: return None
                  raise
          tag=os.environ['TAG_NAME']
          release=request(base+'/releases/tags/'+tag)
          if release is None:
              release=request(base+'/releases',method='POST',payload={'tag_name':tag,'target_commitish':os.environ['SOURCE_PIN'],'name':'OpenIVI FT186 — Direct H.264 и исправления сопряжения','body':notes+footer,'draft':False,'prerelease':True})
          assert release['tag_name']==tag and not release['draft']
          assert release['target_commitish']==os.environ['SOURCE_PIN']
          existing=[a for a in release['assets'] if a['name']==os.environ['APK_NAME']]
          if existing:
              asset=existing[0]
              assert asset['state']=='uploaded' and asset['size']==apk.stat().st_size
              assert asset.get('digest')=='sha256:'+sha
          else:
              url='https://uploads.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/releases/'+str(release['id'])+'/assets?name='+urllib.parse.quote(os.environ['APK_NAME'])
              asset=request(url,method='POST',data=apk.read_bytes(),ctype='application/vnd.android.package-archive')
          assert asset['state']=='uploaded' and asset['size']==apk.stat().st_size
          if asset.get('digest'): assert asset['digest']=='sha256:'+sha
          again=request(base+'/releases/tags/'+tag)
          assert again is not None and again['tag_name']==tag and not again['draft']
          assert again.get('body','').startswith('# OpenIVI FT186')
          assets=[a for a in again['assets'] if a['name']==os.environ['APK_NAME'] and a['state']=='uploaded']
          assert len(assets)==1 and assets[0]['size']==apk.stat().st_size
          if assets[0].get('digest'): assert assets[0]['digest']=='sha256:'+sha
          print('FT186_GITHUB_RELEASE='+again['html_url'],flush=True)
          print('FT186_GITHUB_APK='+assets[0]['browser_download_url'],flush=True)
          print('FT186_GITHUB_ASSET_SHA256='+sha,flush=True)
          print('FT186_GITHUB_RELEASE_READBACK=PASS',flush=True)
          PY
      - name: Deliver signed FT186 to Drive with bounded retries (optional after GitHub release)
        shell: bash
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set -euo pipefail
          src="verified/$APK_NAME"
          if ! command -v rclone >/dev/null || ! rclone listremotes | grep -Fxq 'openivi-drive:'; then
            echo "FT186_DRIVE_DELIVERY=PENDING remote not ready" >&2; exit 1
          fi
          opts=(--tpslimit 0.5 --tpslimit-burst 1 --drive-pacer-min-sleep 2s
                --drive-pacer-burst 1 --retries 1 --low-level-retries 1
                --timeout 35s --contimeout 15s)
          dst="openivi-drive:$APK_NAME"
          if ! timeout -k 10s 165s rclone copyto "$src" "$dst" "${opts[@]}"; then
            echo "FT186_DRIVE_DELIVERY=PENDING rate limit or remote failure" >&2; exit 1
          fi
          expected="$(sha256sum "$src" | cut -d' ' -f1)"
          received="$(timeout -k 10s 165s rclone cat "$dst" "${opts[@]}" | sha256sum | cut -d' ' -f1)"
          if test "$expected" != "$received"; then
            echo "FT186_DRIVE_DELIVERY=PENDING byte verification failure" >&2; exit 1
          fi
          echo "FT186_DRIVE_BYTE_READBACK=PASS SHA256=$received"
          echo "FT186_DRIVE_SIGNED_APK=$dst"
      - name: Remove temporary owner signing material regardless of result
        if: always()
        shell: bash
        run: |
          rm -f ft-xa60-signing.properties .ft-xa60/ft-xa60-owner.p12 .ft-xa60/password.txt
          echo 'FT186_EPHEMERAL_SIGNING_MATERIAL_CLEANUP=PASS'
